function toWesternDigits(s){
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
  return String(s).replace(/[٠-٩]/g, ch => map[ch] ?? ch);
}
function isPeriodToken(str){ return /^[1-7]$/.test(toWesternDigits(str).trim()); }
function periodTokenValue(str){ return Number(toWesternDigits(str).trim()); }

const PDF_ROW_TOL = 4;

function groupItemsIntoLines(items){
  const pts = items
    .filter(it => it.str && it.str.trim() !== '')
    .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));
  pts.sort((a,b) => b.y - a.y || a.x - b.x);
  const lines = [];
  pts.forEach(p => {
    let line = lines.find(l => Math.abs(l.y - p.y) <= PDF_ROW_TOL);
    if(!line){ line = { y: p.y, items: [] }; lines.push(line); }
    line.items.push(p);
    line.y = (line.y * (line.items.length - 1) + p.y) / line.items.length;
  });
  lines.sort((a,b) => b.y - a.y);
  lines.forEach(l => l.items.sort((a,b) => a.x - b.x));
  return lines;
}

function lineText(line){
  return line.items.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
}

function findDayHeaderLine(lines){
  for(const line of lines){
    const text = lineText(line);
    const matches = DAYS.filter(d => text.includes(d));
    if(matches.length >= 3) return line;
  }
  return null;
}

function buildDayColumns(headerLine){
  const cols = [];
  DAYS.forEach(day => {
    const matchItems = headerLine.items.filter(it => it.str.includes(day));
    if(matchItems.length){
      const xs = matchItems.map(it => it.x);
      const center = xs.reduce((a,b)=>a+b,0) / xs.length;
      cols.push({ day, center });
    }
  });
  if(cols.length < 3) return null;
  cols.sort((a,b) => a.center - b.center);
  const bounds = [];
  for(let i=0;i<cols.length;i++){
    const left = i===0 ? -Infinity : (cols[i-1].center + cols[i].center)/2;
    const right = i===cols.length-1 ? Infinity : (cols[i].center + cols[i+1].center)/2;
    bounds.push({ day: cols[i].day, left, right });
  }
  return bounds;
}

function findPeriodRows(lines, headerLine){
  const bodyLines = lines.filter(l => l !== headerLine);
  const rows = [];
  bodyLines.forEach(line => {
    const numItem = line.items.find(it => isPeriodToken(it.str));
    if(numItem) rows.push({ period: periodTokenValue(numItem.str), line });
  });
  const seen = new Set();
  const uniqueRows = [];
  rows.forEach(r => { if(!seen.has(r.period)){ seen.add(r.period); uniqueRows.push(r); } });
  return uniqueRows;
}

function extractScheduleFromLines(lines){
  const headerLine = findDayHeaderLine(lines);
  if(!headerLine) return { ok:false, reason:'لم يتم العثور على صف يحتوي على أسماء الأيام.' };
  const dayCols = buildDayColumns(headerLine);
  if(!dayCols) return { ok:false, reason:'تعذر تحديد أعمدة الأيام بدقة.' };
  const periodRows = findPeriodRows(lines, headerLine);
  if(periodRows.length < 3) return { ok:false, reason:'تعذر تحديد صفوف الحصص (١-٧) بدقة.' };

  const schedule = emptySchedule();
  periodRows.forEach(({ period, line }) => {
    dayCols.forEach(col => {
      const cellItems = line.items.filter(it => it.x > col.left && it.x <= col.right && !isPeriodToken(it.str));
      const text = cellItems.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
      if(text) schedule[col.day][period] = { busy:true, subject:text };
    });
  });
  return { ok:true, schedule };
}

function guessNameAndSubject(lines, headerLine){
  const aboveLines = lines.filter(l => headerLine ? l.y > headerLine.y : true);
  let name = '', subject = '';
  const nameLabels = ['اسم المعلم', 'المعلم :', 'المعلم:', 'الاسم'];
  const subjectLabels = ['التخصص', 'المادة'];
  aboveLines.forEach(line => {
    const text = lineText(line);
    if(!name){
      for(const lbl of nameLabels){
        const idx = text.indexOf(lbl);
        if(idx !== -1){
          const rest = text.slice(idx + lbl.length).replace(/^[:\s]+/, '').trim();
          if(rest){ name = rest; break; }
        }
      }
    }
    if(!subject){
      for(const lbl of subjectLabels){
        const idx = text.indexOf(lbl);
        if(idx !== -1){
          const rest = text.slice(idx + lbl.length).replace(/^[:\s]+/, '').trim();
          if(rest){ subject = rest; break; }
        }
      }
    }
  });
  if(!name && aboveLines.length){
    const longest = aboveLines.reduce((a,b) => lineText(b).length > lineText(a).length ? b : a, aboveLines[0]);
    name = lineText(longest);
  }
  return { name, subject };
}

async function extractTeacherFromPage(page){
  const textContent = await page.getTextContent();
  if(!textContent.items || textContent.items.length < 5){
    return { ok:false, reason:'لا يوجد نص كافٍ في هذه الصفحة (قد تكون صورة ممسوحة ضوئياً).' };
  }
  const lines = groupItemsIntoLines(textContent.items);
  const headerLine = findDayHeaderLine(lines);
  const { name, subject } = guessNameAndSubject(lines, headerLine);
  const result = extractScheduleFromLines(lines);
  if(!result.ok){
    return { ok:false, reason: result.reason, partialName: name, partialSubject: subject };
  }
  let nisab = 0;
  DAYS.forEach(d => PERIODS.forEach(p => { if(result.schedule[d][p].busy) nisab++; }));
  return { ok:true, name: name || 'معلم بدون اسم', subject: subject || '—', nisab, schedule: result.schedule };
}

function parsePastedScheduleText(text){
  const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let headerIdx = -1;
  for(let i=0;i<rawLines.length;i++){
    const matches = DAYS.filter(d => rawLines[i].includes(d));
    if(matches.length >= 3){ headerIdx = i; break; }
  }
  if(headerIdx === -1) throw new Error('لم يتم العثور على صف يحتوي على أسماء الأيام في النص الملصق.');
  const headerLine = rawLines[headerIdx];
  const dayOrder = DAYS
    .map(d => ({ d, idx: headerLine.indexOf(d) }))
    .filter(x => x.idx !== -1)
    .sort((a,b) => a.idx - b.idx)
    .map(x => x.d);
  const schedule = emptySchedule();
  let period = 1;
  for(let i = headerIdx+1; i < rawLines.length && period <= 7; i++){
    const line = rawLines[i];
    let cells = line.split(/\t+|\s{2,}/).map(c => c.trim());
    if(cells.length && isPeriodToken(cells[0])){
      period = periodTokenValue(cells[0]);
      cells = cells.slice(1);
    }
    dayOrder.forEach((day, idx) => {
      const val = (cells[idx] || '').trim();
      if(val) schedule[day][period] = { busy:true, subject: val };
    });
    period++;
  }
  let nisab = 0;
  DAYS.forEach(d => PERIODS.forEach(p => { if(schedule[d][p].busy) nisab++; }));
  return { schedule, nisab };
}

function useClipboardCopy(){
  const [msg, setMsg] = useState('');
  const copy = useCallback((text, successMsg) => {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => setMsg(successMsg || 'تم النسخ إلى الحافظة.'))
        .catch(() => setMsg('تعذر النسخ التلقائي — انسخ النص يدوياً من المربع أدناه.'));
    } else {
      setMsg('النسخ التلقائي غير مدعوم في هذا المتصفح — انسخ النص يدوياً.');
    }
  }, []);
  useEffect(() => {
    if(!msg) return;
    const t = setTimeout(() => setMsg(''), 4500);
    return () => clearTimeout(t);
  }, [msg]);
  return { copy, msg };
}

function Dot({ busy }){
  return <span className={'dot ' + (busy ? 'dot-busy' : 'dot-free')} />;
}

// خلية حصة تعرض رمز الفصل/المادة نصاً واضحاً ومميزاً عند الإشغال (مثل "3/2ب" أو "1/4")،
// وشرطة خفيفة عند الفراغ — بدل نقطة ملوّنة فقط يظهر معناها بالتحويم فوقها.
function ScheduleCell({ cell, onClick }){
  const editable = typeof onClick === 'function';
  const busy = !!(cell && cell.busy);
  const cls = 'sched-cell ' + (busy ? 'sched-busy' : 'sched-free') + (editable ? ' sched-cell-editable' : '');
  const title = editable
    ? (busy ? ((cell.subject || 'مشغولة') + ' — انقر للتعديل أو الحذف') : 'حصة فراغ — انقر لإضافة حصة')
    : (busy ? (cell.subject || 'مشغولة') : 'حصة فراغ');
  return (
    <span
      className={cls}
      title={title}
      onClick={onClick}
      role={editable ? 'button' : undefined}
      tabIndex={editable ? 0 : undefined}
      onKeyDown={editable ? (e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onClick(e); } }) : undefined}
    >
      {busy ? (cell.subject || '•') : '—'}
    </span>
  );
}

// نافذة التعديل التفاعلي المباشر لحصة واحدة من جدول معلم/ة: تضيف حصة جديدة على فراغ، أو تعرض
// خياري "تعديل" و"حذف" (بلون أحمر تحذيري) لحصة مشغولة — أي تغيير يُطبَّق فوراً عبر onSave/onClear
// ليعيد App() احتساب النصاب الأسبوعي وحالة الاستبعاد التلقائي ويدفع النسخة الجديدة سحابياً.
function ScheduleEditorModal({ teacher, day, period, onSave, onClear, onClose }){
  const cell = teacher.schedule[day][period];
  const isBusy = !!(cell && cell.busy);
  const initialParts = isBusy && cell.subject ? cell.subject.split(' - ') : [];
  const [className, setClassName] = useState(initialParts[0] || '');
  const [subjectName, setSubjectName] = useState(initialParts.slice(1).join(' - ') || '');
  const [mode, setMode] = useState(isBusy ? 'view' : 'add');

  const combined = (className.trim() && subjectName.trim())
    ? (className.trim() + ' - ' + subjectName.trim())
    : (className.trim() || subjectName.trim());

  const handleSave = () => {
    if(!combined) return;
    onSave({ busy:true, subject: combined });
  };

  return (
    <div className="modal-backdrop no-print" role="dialog" aria-modal="true" aria-label="تعديل حصة الجدول">
      <div className="modal-panel" style={{maxWidth:420}}>
        <div className="modal-header">
          <h3 className="card-title" style={{margin:0}}>{teacher.name} — {day} — الحصة {period}</h3>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>إغلاق</button>
        </div>

        {mode === 'view' ? (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <p className="card-sub">الحصة مشغولة حالياً بـ: <strong>{cell.subject || 'بيانات غير مسجلة'}</strong></p>
            <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
              <button className="btn btn-secondary" onClick={() => setMode('edit')}>تعديل بيانات الحصة</button>
              <button className="btn btn-danger" onClick={onClear}>حذف الحصة (إعادتها فراغاً)</button>
            </div>
          </div>
        ) : (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <div className="field">
              <label className="field-label" htmlFor="sched-edit-class">الصف / الفصل</label>
              <input id="sched-edit-class" className="input" value={className} onChange={e=>setClassName(e.target.value)} placeholder="مثال: 4/2" autoFocus />
            </div>
            <div className="field">
              <label className="field-label" htmlFor="sched-edit-subject">المادة</label>
              <input id="sched-edit-subject" className="input" value={subjectName} onChange={e=>setSubjectName(e.target.value)} placeholder="مثال: رياضيات" />
            </div>
            <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={handleSave} disabled={!combined}>حفظ الحصة</button>
              {isBusy && <button className="btn btn-secondary" onClick={() => setMode('view')}>تراجع</button>}
              {isBusy && <button className="btn btn-danger" onClick={onClear}>حذف الحصة</button>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, tone }){
  return (
    <div className="stat-card">
      <span className="stat-label">{label}</span>
      <span className={'stat-value tabular' + (tone ? ' ' + tone : '')}>{value}</span>
    </div>
  );
}

function Toast({ message }){
  if(!message) return null;
  return <div className="toast no-print" role="status">{message}</div>;
}

function WhatsAppButton({ teacher, assignment }){
  const { settings, labels } = useSchool();
  const digits = teacher && teacher.phone ? toWhatsAppDigits(teacher.phone) : '';
  if(!digits || digits.length < 11){
    return <span className="badge badge-count no-print" style={{fontSize:11}} title="لا يوجد رقم جوال صالح مسجل لهذا المعلم">لا يوجد رقم جوال</span>;
  }
  const message = buildWhatsAppMessage(teacher.name, assignment.absentTeacherName, assignment, labels, settings.schoolName);
  const href = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
  return (
    <a className="btn btn-whatsapp btn-sm no-print" href={href} target="_blank" rel="noopener noreferrer">
      إرسال إشعار واتساب
    </a>
  );
}

function DashboardTab({ teachers, isSample }){
  const { labels } = useSchool();
  const stats = useMemo(() => computeStats(teachers), [teachers]);
  const availability = useMemo(() => computeDayAvailability(teachers, false), [teachers]);
  const maxAvail = Math.max(1, ...availability.map(a => a.count));
  const ranked = useMemo(() => [...teachers].sort((a,b)=>b.substituteCount-a.substituteCount), [teachers]);
  const most = ranked.slice(0,5);
  const least = [...ranked].reverse().slice(0,5);

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">لا توجد بيانات بعد. انتقل إلى تبويب «استيراد البيانات» لتحميل بيانات تجريبية أو استيراد جدولك.</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:16}}>
      <div className="stat-grid">
        <StatCard label={'إجمالي ' + labels.teachersOf} value={stats.total} />
        <StatCard label={labels.teachers + ' بنصاب كامل (24)'} value={stats.fullCount} tone="danger" />
        <StatCard label="مستبعدون إدارياً من الانتظار" value={stats.excludedCount} tone="danger" />
        <StatCard label="متوسط النصاب الأسبوعي" value={stats.avgLoad.toFixed(1)} />
        <StatCard label="إجمالي حصص الانتظار المنفذة" value={stats.totalSub} tone="accent" />
      </div>

      <div className="two-col">
        <div className="card">
          <h3 className="card-title">فراغات اليوم المتاحة للانتظار</h3>
          <p className="card-sub">عدد حصص الفراغ المؤهلة (باستثناء أصحاب النصاب الكامل) في كل يوم</p>
          {availability.map(a => (
            <div className="bar-row" key={a.day}>
              <span className="bar-label">{a.day}</span>
              <div className="bar-track"><div className="bar-fill" style={{width:(a.count/maxAvail*100)+'%'}} /></div>
              <span className="bar-value tabular">{a.count}</span>
            </div>
          ))}
        </div>

        <div className="card">
          <h3 className="card-title">عدالة التوزيع</h3>
          <p className="card-sub">الأكثر تنفيذاً مقابل الأقل تنفيذاً لحصص الانتظار</p>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
            <div>
              <div className="badge badge-danger" style={{marginBottom:8}}>الأكثر تحميلاً</div>
              <ul className="rank-list">
                {most.map(t => (
                  <li className="rank-row" key={t.id}>
                    <span><span className="rank-name">{t.name}</span><br/><span className="rank-sub">{t.subject}</span></span>
                    <span className="rank-count tabular">{t.substituteCount}</span>
                  </li>
                ))}
              </ul>
            </div>
            <div>
              <div className="badge badge-accent" style={{marginBottom:8}}>الأقل تحميلاً</div>
              <ul className="rank-list">
                {least.map(t => (
                  <li className="rank-row" key={t.id}>
                    <span><span className="rank-name">{t.name}</span><br/><span className="rank-sub">{t.subject}</span></span>
                    <span className="rank-count tabular">{t.substituteCount}</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// عنصر تحكم الاستبعاد الإداري لكل معلم/ة: تفعيل/إلغاء فوري ومطلق من قائمة المفاضلة، مع اختيار
// سبب من قائمة شائعة (رائد نشاط، موجه طلابي، مهام إدارية) أو كتابة سبب مخصص.
function ExclusionControl({ teacher, gender, onUpdate }){
  const reasonOptions = useMemo(() => getExclusionReasonOptions(gender), [gender]);
  const isCustom = !!teacher.excluded && !!teacher.exclusionReason && !reasonOptions.includes(teacher.exclusionReason);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:4, alignItems:'stretch', minWidth:132}}>
      <label style={{display:'flex', alignItems:'center', gap:6, fontSize:11.5, fontWeight:700, whiteSpace:'nowrap', justifyContent:'center'}}>
        <input type="checkbox" checked={!!teacher.excluded} onChange={e => {
          const checked = e.target.checked;
          onUpdate(teacher.id, { excluded: checked, exclusionReason: checked ? (teacher.exclusionReason || reasonOptions[0]) : '' });
        }} />
        استبعاد إداري
      </label>
      {teacher.excluded && (
        <select className="select" style={{fontSize:11, padding:'4px 6px'}}
          value={isCustom ? '__custom__' : teacher.exclusionReason}
          onChange={e => onUpdate(teacher.id, { exclusionReason: e.target.value === '__custom__' ? '' : e.target.value })}
        >
          {reasonOptions.map(r => <option key={r} value={r}>{r}</option>)}
          <option value="__custom__">سبب آخر (حدد)</option>
        </select>
      )}
      {teacher.excluded && isCustom && (
        <input className="input" style={{fontSize:11, padding:'4px 6px'}} value={teacher.exclusionReason} onChange={e=>onUpdate(teacher.id, { exclusionReason: e.target.value })} placeholder="اكتب السبب" autoFocus />
      )}
    </div>
  );
}

function TeachersTab({ teachers, onUpdatePhone, onUpdateExclusion, onUpdateSchedule }){
  const { labels, settings } = useSchool();
  const [search, setSearch] = useState('');
  const [hideFull, setHideFull] = useState(false);
  const [editingCell, setEditingCell] = useState(null); // { teacherId, day, period } | null

  const filtered = useMemo(() => {
    return teachers.filter(t => {
      if(hideFull && isFullQuota(t.nisab)) return false;
      if(search.trim() === '') return true;
      const q = search.trim();
      return t.name.includes(q) || t.subject.includes(q);
    });
  }, [teachers, search, hideFull]);

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">{'لا توجد بيانات ' + labels.teachersOf + '. استورد جدولك أو حمّل بيانات تجريبية من تبويب «استيراد البيانات».'}</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card">
        <div className="toolbar">
          <div className="field">
            <label className="field-label" htmlFor="teacher-search">بحث بالاسم أو التخصص</label>
            <input id="teacher-search" className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="مثال: رياضيات" />
          </div>
          <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, fontWeight:600, paddingBottom:9}}>
            <input type="checkbox" id="hide-full" checked={hideFull} onChange={e=>setHideFull(e.target.checked)} />
            إخفاء أصحاب النصاب الكامل
          </label>
          <span className="badge badge-count" style={{alignSelf:'center'}}>{filtered.length} من {teachers.length}</span>
        </div>
      </div>

      <div className="table-scroll">
        <table className="matrix">
          <thead>
            <tr>
              <th className="name-head" rowSpan="2">{labels.teacherDef}</th>
              <th rowSpan="2">التخصص</th>
              <th rowSpan="2">رقم الجوال</th>
              <th rowSpan="2">النصاب</th>
              <th rowSpan="2">منفذ الانتظار</th>
              <th rowSpan="2">الاستبعاد الإداري</th>
              {DAYS.map(day => <th key={day} colSpan="7" className="col-day-start">{day}</th>)}
            </tr>
            <tr>
              {DAYS.map(day => PERIODS.map(p => (
                <th key={day+p} className={p===1 ? 'col-day-start' : ''}>{p}</th>
              )))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(t => (
              <tr key={t.id}>
                <td className="name-cell">
                  {t.name}
                  {isFullQuota(t.nisab) && <span className="badge badge-danger" style={{marginRight:6, fontSize:10.5}}>نصاب كامل</span>}
                  {t.excluded && <span className="badge badge-warn" style={{marginRight:6, fontSize:10.5}}>مستبعد إدارياً</span>}
                </td>
                <td>{t.subject}</td>
                <td>
                  <input className="phone-input" value={t.phone || ''} onChange={e => onUpdatePhone(t.id, e.target.value)} placeholder="05xxxxxxxx" />
                </td>
                <td className="tabular">{t.nisab}</td>
                <td className="tabular">{t.substituteCount}</td>
                <td><ExclusionControl teacher={t} gender={settings.gender} onUpdate={onUpdateExclusion} /></td>
                {DAYS.map(day => PERIODS.map(p => {
                  const cell = t.schedule[day][p];
                  return (
                    <td key={day+p} className={p===1 ? 'col-day-start' : ''}>
                      <ScheduleCell
                        cell={cell}
                        onClick={onUpdateSchedule ? (() => setEditingCell({ teacherId: t.id, day, period: p })) : undefined}
                      />
                    </td>
                  );
                }))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="legend-item"><span className="sched-cell sched-free">—</span> حصة فراغ (انقر لإضافة حصة)</span>
        <span className="legend-item"><span className="sched-cell sched-busy">3/2ب</span> حصة مشغولة (انقر للتعديل أو الحذف)</span>
        <span className="legend-item"><span className="badge badge-danger" style={{fontSize:10.5}}>نصاب كامل</span> يُستبعد تلقائياً من الترشيح إلا للضرورة</span>
        <span className="legend-item"><span className="badge badge-warn" style={{fontSize:10.5}}>مستبعد إدارياً</span> يُستبعد كلياً ومطلقاً من الترشيح مهما كانت الحصة</span>
      </div>

      {editingCell && (() => {
        const editingTeacher = teachers.find(t => t.id === editingCell.teacherId);
        if(!editingTeacher) return null;
        return (
          <ScheduleEditorModal
            teacher={editingTeacher}
            day={editingCell.day}
            period={editingCell.period}
            onClose={() => setEditingCell(null)}
            onSave={(cellPatch) => {
              onUpdateSchedule(editingCell.teacherId, editingCell.day, editingCell.period, cellPatch);
              setEditingCell(null);
            }}
            onClear={() => {
              onUpdateSchedule(editingCell.teacherId, editingCell.day, editingCell.period, { busy:false, subject:'' });
              setEditingCell(null);
            }}
          />
        );
      })()}
    </div>
  );
}

// بطاقة بارزة تعرض جدول المعلم الغائب في اليوم المحدد فقط: كل حصص يومه السبع، مع اسم
// الفصل/المادة لكل حصة مشغولة (الشاغرة فعلياً وتحتاج بديلاً) وتمييز حصص الفراغ.
function AbsentDaySchedule({ teacher, day }){
  const { labels } = useSchool();
  return (
    <div className="card" style={{borderColor:'var(--accent)', borderWidth:2, borderStyle:'solid'}}>
      <h3 className="card-title">جدول {labels.honorific} {teacher.name} — يوم {day}</h3>
      <p className="card-sub">النصاب الأسبوعي: {teacher.nisab}{isFullQuota(teacher.nisab) ? ' (نصاب كامل)' : ''} · منفذ الانتظار حالياً: {teacher.substituteCount}</p>
      <div className="day-schedule-grid">
        {PERIODS.map(p => {
          const cell = teacher.schedule[day][p];
          return (
            <div key={p} className={'day-schedule-cell ' + (cell.busy ? 'is-busy' : 'is-free')}>
              <span className="day-schedule-period">الحصة {p}</span>
              <span className="day-schedule-value">{cell.busy ? (cell.subject || 'مشغولة') : 'فراغ'}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// محرك المفاضلة وترشيح البدلاء لحصة شاغرة واحدة: يستبعد المعلم الغائب نفسه استبعاداً تاماً
// (قاعدة أمنية إلزامية)، يقتصر على من لديه فراغ مؤكد في نفس اليوم والحصة، يستبعد أصحاب النصاب
// الكامل تلقائياً إلا عند تفعيل تبديل الضرورة القصوى، ويرتّب تصاعدياً حسب "منفذ الانتظار".
function VacantSlotCard({ day, period, className, absentTeacher, teachers, date, assignments, onAssign, onRemoveAssignment }){
  const { labels } = useSchool();
  const [includeFullQuota, setIncludeFullQuota] = useState(false);

  const candidates = useMemo(() => {
    return eligibleForSlot(teachers, day, period, includeFullQuota)
      .filter(t => t.id !== absentTeacher.id); // قاعدة إلزامية: استبعاد المعلم الغائب من قائمة البدلاء
  }, [teachers, day, period, includeFullQuota, absentTeacher.id]);

  const slotAssignments = useMemo(() => assignments.filter(a =>
    a.date === date && a.day === day && a.period === period && a.absentTeacherName === absentTeacher.name
  ), [assignments, date, day, period, absentTeacher.name]);

  const teacherLookup = useMemo(() => Object.fromEntries(teachers.map(t => [t.id, t])), [teachers]);

  return (
    <div className="card">
      <div className="vacant-slot-head">
        <h4 style={{margin:0}}>الحصة {period}{className ? (' — ' + className) : ''}</h4>
        <label style={{display:'flex', alignItems:'center', gap:8, fontSize:12.5, fontWeight:600}}>
          <input type="checkbox" checked={includeFullQuota} onChange={e=>setIncludeFullQuota(e.target.checked)} />
          إشراك أصحاب النصاب الكامل للضرورة القصوى
        </label>
      </div>

      {slotAssignments.length > 0 && (
        <div style={{marginBottom:10}}>
          {slotAssignments.map(a => (
            <div className="assign-log-item" key={a.id}>
              <span>تم اعتماد التكليف: <strong>{a.teacherName}</strong></span>
              <div className="assign-log-actions">
                <WhatsAppButton teacher={teacherLookup[a.teacherId]} assignment={a} />
                <button className="btn btn-secondary btn-sm" onClick={() => onRemoveAssignment(a.id)}>تراجع عن التكليف</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {slotAssignments.length === 0 && (
        candidates.length === 0 ? (
          <p className="empty-note">{'لا يوجد ' + labels.teacher + ' متفرغ في هذه الحصة ضمن المعايير الحالية.'}</p>
        ) : (
          candidates.map((t,i) => {
            const sameDayLoad = countBusyInDay(t, day);
            return (
              <div className="finder-result" key={t.id}>
                <span>
                  <span className="finder-name">{i===0 && <span className="badge badge-accent" style={{marginLeft:6, fontSize:10.5}}>الأنسب — الأقل نصاباً وعبئاً</span>}{t.name}</span><br/>
                  <span className="finder-meta">
                    النصاب الأسبوعي: {t.nisab}{isFullQuota(t.nisab) ? ' (كامل)' : ''} · حصص اليوم: {sameDayLoad} · رصيد الانتظار: {t.substituteCount}
                  </span>
                </span>
                <button
                  className="btn btn-primary btn-sm"
                  onClick={() => onAssign({ teacherId:t.id, date, day, period, className, subject: absentTeacher.subject, absentTeacherName: absentTeacher.name })}
                >
                  اعتماد التكليف
                </button>
              </div>
            );
          })
        )
      )}
    </div>
  );
}

function FinderTab({ teachers, assignments, onAssign, onRemoveAssignment, onGoToPrint }){
  const { labels } = useSchool();
  const defaultDay = useMemo(() => arabicDayFromDate(todayIso()) || DAYS[0], []);
  const [date, setDate] = useState(todayIso());
  const [day, setDay] = useState(defaultDay);
  const [absentTeacherId, setAbsentTeacherId] = useState('');

  const sortedTeachers = useMemo(() => teachers.slice().sort((a,b) => a.name.localeCompare(b.name,'ar')), [teachers]);
  const absentTeacher = useMemo(() => teachers.find(t => t.id === absentTeacherId) || null, [teachers, absentTeacherId]);
  const vacantPeriods = useMemo(() => {
    if(!absentTeacher) return [];
    return PERIODS.filter(p => absentTeacher.schedule[day][p].busy);
  }, [absentTeacher, day]);

  const dayAssignmentsCount = useMemo(() => assignments.filter(a => a.date === date).length, [assignments, date]);

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">{'لا توجد بيانات ' + labels.teachersOf + ' بعد. استورد جدولك أولاً.'}</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card">
        <h3 className="card-title">تعيين حصص الانتظار</h3>
        <p className="card-sub">اختر اليوم والمعلم الغائب لعرض حصصه الشاغرة فوراً، ثم اعتمد البديل الأنسب لكل حصة على حدة. يرتّب النظام البدلاء تلقائياً: الأقل نصاباً أساسياً أولاً، ثم الأقل حصصاً في نفس اليوم فاليوم التالي، ثم الأقل تنفيذاً لحصص الانتظار تراكمياً.</p>
        <div className="toolbar">
          <div className="field">
            <label className="field-label" htmlFor="finder-day">اليوم</label>
            <select id="finder-day" className="select" value={day} onChange={e=>setDay(e.target.value)}>
              {DAYS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          <div className="field">
            <label className="field-label" htmlFor="finder-absent">{labels.absentTeacher}</label>
            <select id="finder-absent" className="select" value={absentTeacherId} onChange={e=>setAbsentTeacherId(e.target.value)}>
              <option value="">{'— اختر ' + labels.absentTeacher + ' —'}</option>
              {sortedTeachers.map(t => (
                <option key={t.id} value={t.id}>{t.name}{isFullQuota(t.nisab) ? ' (نصاب كامل)' : ''}</option>
              ))}
            </select>
          </div>
          <div className="field">
            <label className="field-label" htmlFor="finder-date">تاريخ التكليف (للسجل والطباعة وإشعار واتساب)</label>
            <input id="finder-date" type="date" className="input" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
        </div>
        {dayAssignmentsCount > 0 && (
          <div className="card-sub" style={{marginTop:10, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
            <span>تم اعتماد {dayAssignmentsCount} تكليف حتى الآن بتاريخ {formatArabicDate(date)}.</span>
            <button className="btn btn-secondary btn-sm" onClick={onGoToPrint}>طباعة كشف التكليف الرسمي</button>
          </div>
        )}
      </div>

      {!absentTeacher && (
        <div className="card"><p className="empty-note">{'اختر ' + labels.absentTeacher + ' من القائمة أعلاه لعرض جدوله وحصصه الشاغرة في هذا اليوم.'}</p></div>
      )}

      {absentTeacher && (
        <>
          <AbsentDaySchedule teacher={absentTeacher} day={day} />

          {vacantPeriods.length === 0 ? (
            <div className="card"><p className="empty-note">{absentTeacher.name} {labels.isGirls ? 'ليس لديها' : 'ليس لديه'} أي حصة مشغولة يوم {day} — لا توجد حصص تحتاج تغطية بالانتظار.</p></div>
          ) : (
            <div style={{display:'flex', flexDirection:'column', gap:12}}>
              {vacantPeriods.map(p => (
                <VacantSlotCard
                  key={p}
                  day={day}
                  period={p}
                  className={absentTeacher.schedule[day][p].subject}
                  absentTeacher={absentTeacher}
                  teachers={teachers}
                  date={date}
                  assignments={assignments}
                  onAssign={onAssign}
                  onRemoveAssignment={onRemoveAssignment}
                />
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ترويسة رسمية موحّدة تُستخدم في جميع نماذج الطباعة (بيان التكليف اليومي والتقارير التراكمية):
// تعرض شعاري الوزارة/الإدارة (يمين) والمدرسة/الرؤية (يسار) إن وُجدا، وإلا تحتفظ بالترويسة النصية
// القياسية دون أي تشوه بصري في التنسيق.
function Letterhead({ title, dateLine }){
  const { settings } = useSchool();
  const textBlock = (
    <>
      <p className="lh-line lh-bold">المملكة العربية السعودية</p>

// ===== التقارير التراكمية v10: ثلاثة تقارير فرعية مستقلة تماماً (سجل وإحصائيات الغياب، سجل
// وإحصائيات إشغال حصص الانتظار، مؤشرات العدالة والعبء الإداري)، كل منها بشريط فلترة وأزرار طباعة/
// تصدير خاصة به، بدل صفحة واحدة مدمجة كما كانت سابقاً. =====

// فلترة زمنية موحّدة عبر التقارير الثلاثة: أزرار سريعة (اليوم/هذا الأسبوع/هذا الشهر/الفصل الدراسي
// كاملاً) أو نطاق تاريخ مخصص بالكامل.
function computePresetRange(preset, fromDate, toDate){
  if(preset === 'today'){ const t = todayIso(); return { from:t, to:t }; }
  if(preset === 'week') return { from: startOfWeekIso(), to: todayIso() };
  if(preset === 'month') return { from: startOfMonthIso(), to: todayIso() };
  if(preset === 'term') return { from:'', to:'' };
  return { from: fromDate, to: toDate }; // 'custom'
}

const PERIOD_PRESETS = [
  { id:'today', label:'اليوم' },
  { id:'week', label:'هذا الأسبوع' },
  { id:'month', label:'هذا الشهر' },
  { id:'term', label:'الفصل الدراسي كاملاً' },
  { id:'custom', label:'نطاق تاريخ مخصص' }
];

function PeriodFilterBar({ idPrefix, preset, setPreset, fromDate, setFromDate, toDate, setToDate }){
  return (
    <>
      <div className="toolbar no-print" style={{marginBottom:10}}>
        {PERIOD_PRESETS.map(p => (
          <button
            key={p.id}
            type="button"
            className={'btn btn-sm ' + (preset === p.id ? 'btn-primary' : 'btn-secondary')}
            onClick={() => setPreset(p.id)}
          >
            {p.label}
          </button>
        ))}
      </div>
      {preset === 'custom' && (
        <div className="toolbar no-print">
          <div className="field">
            <label className="field-label" htmlFor={idPrefix + '-from'}>من تاريخ</label>
            <input id={idPrefix + '-from'} type="date" className="input" value={fromDate} onChange={e=>setFromDate(e.target.value)} />
          </div>
          <div className="field">
            <label className="field-label" htmlFor={idPrefix + '-to'}>إلى تاريخ</label>
            <input id={idPrefix + '-to'} type="date" className="input" value={toDate} onChange={e=>setToDate(e.target.value)} />
          </div>
        </div>
      )}
    </>
  );
}

function rangeLabelOf(range){
  return (range.from || range.to)
    ? ('من ' + (range.from ? formatArabicDate(range.from) : 'البداية') + ' إلى ' + (range.to ? formatArabicDate(range.to) : 'اليوم'))
    : 'كل البيانات المسجلة';
}

function buildAbsenceReportCsv(events){
  const header = ['م','تاريخ الغياب','اليوم','اسم الغائب/ة','التخصص','عدد الحصص المهدرة','تفاصيل الفصول والمواد المتأثرة'];
  const lines = [header.map(toCsvValue).join(',')];
  events.forEach((e,i) => {
    lines.push([i+1, e.date, e.day || '', e.absentTeacherName, e.subject || '—', e.periods, e.details.join('؛ ')].map(toCsvValue).join(','));
  });
  return '﻿' + lines.join('\r\n');
}

function buildOccupancyReportCsv(rows){
  const header = ['م','التاريخ','اليوم','الحصة','الفصل','المادة','المعلم/ة المكلَّف/ة','المعلم/ة الغائب/ة','الرصيد حتى هذا التكليف'];
  const lines = [header.map(toCsvValue).join(',')];
  rows.forEach((a,i) => {
    lines.push([i+1, a.date, a.day || arabicDayFromDate(a.date) || '', a.period, a.className || '', a.subject || '', a.teacherName, a.absentTeacherName || '', a.balance].map(toCsvValue).join(','));
  });
  return '﻿' + lines.join('\r\n');
}

function buildEquityReportCsv(rows){
  const header = ['م','الاسم','النصاب','حصص الانتظار المنفذة بالفترة','الانحراف عن المتوسط'];
  const lines = [header.map(toCsvValue).join(',')];
  rows.forEach((r,i) => {
    lines.push([i+1, r.teacher.name, r.teacher.nisab, r.count, r.deviation.toFixed(1)].map(toCsvValue).join(','));
  });
  return '﻿' + lines.join('\r\n');
}

// ===== التقرير الأول: سجل وإحصائيات الغياب =====
function AbsenteeismReport({ teachers, assignments }){
  const { labels, driveUrl } = useSchool();
  const [preset, setPreset] = useState('week');
  const [fromDate, setFromDate] = useState(startOfWeekIso());
  const [toDate, setToDate] = useState(todayIso());
  const [search, setSearch] = useState('');
  const { copy, msg } = useClipboardCopy();

  const range = useMemo(() => computePresetRange(preset, fromDate, toDate), [preset, fromDate, toDate]);
  const rangeLabel = useMemo(() => rangeLabelOf(range), [range]);
  const teacherByName = useMemo(() => Object.fromEntries(teachers.map(t => [t.name, t])), [teachers]);

  const filteredAssignments = useMemo(() => assignments.filter(a => {
    if(range.from && a.date < range.from) return false;
    if(range.to && a.date > range.to) return false;
    if(search.trim() && !(a.absentTeacherName || '').includes(search.trim())) return false;
    return true;
  }), [assignments, range, search]);

  // حدث غياب واحد = نفس التاريخ ونفس اسم الغائب/ة؛ "الحصص المهدرة" هو عدد الحصص التي غطّاها
  // الانتظار في ذلك الغياب تحديداً، مع تفصيل الفصل/المادة لكل حصة منها.
  const absenceEvents = useMemo(() => {
    const map = new Map();
    filteredAssignments.forEach(a => {
      if(!a.absentTeacherName) return;
      const key = a.date + '|' + a.absentTeacherName;
      if(!map.has(key)){
        const absentT = teacherByName[a.absentTeacherName];
        map.set(key, {
          absentTeacherName: a.absentTeacherName, date: a.date, day: a.day || arabicDayFromDate(a.date),
          subject: (absentT && absentT.subject) || a.subject || '—',
          periods: 0, details: []
        });
      }
      const ev = map.get(key);
      ev.periods += 1;
      ev.details.push('ح' + a.period + ': ' + (a.className || '—'));
    });
    return Array.from(map.values()).sort((x,y) => (x.date < y.date ? 1 : (x.date > y.date ? -1 : 0)));
  }, [filteredAssignments, teacherByName]);

  const stats = useMemo(() => {
    const totalDays = absenceEvents.length;
    const totalPeriods = absenceEvents.reduce((s,e) => s + e.periods, 0);
    const dayCounts = {};
    absenceEvents.forEach(e => { const d = e.day || '—'; dayCounts[d] = (dayCounts[d] || 0) + 1; });
    let topDay = '—', topCount = 0;
    Object.entries(dayCounts).forEach(([d,c]) => { if(c > topCount){ topCount = c; topDay = d; } });
    return { totalDays, totalPeriods, topDay: totalDays ? topDay : '—' };
  }, [absenceEvents]);

  const handleExport = () => {
    const csv = buildAbsenceReportCsv(absenceEvents);
    copy(csv, 'تم نسخ سجل الغياب كنص CSV إلى الحافظة — الصقه في Excel أو Google Sheets.');
    archiveReportToCloud(driveUrl, 'سجل_الغياب', 'سجل-الغياب', csv);
  };
  const handlePrint = () => {
    archiveReportToCloud(driveUrl, 'سجل_الغياب', 'سجل-الغياب', buildAbsenceReportCsv(absenceEvents));
    window.print();
  };

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">{'لا توجد بيانات ' + labels.teachersOf + ' بعد.'}</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card no-print">
        <h3 className="card-title">سجل وإحصائيات الغياب</h3>
        <p className="card-sub">اختر فترة زمنية، واختيارياً ابحث باسم معلم/ة محدد، لعرض سجل الغياب وإحصائياته، ثم اطبعه أو صدّره.</p>
        <PeriodFilterBar idPrefix="abs" preset={preset} setPreset={setPreset} fromDate={fromDate} setFromDate={setFromDate} toDate={toDate} setToDate={setToDate} />
        <div className="toolbar" style={{marginTop:10}}>
          <div className="field" style={{maxWidth:260}}>
            <label className="field-label" htmlFor="abs-search">بحث باسم المعلم/ة</label>
            <input id="abs-search" className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="اكتب جزءاً من الاسم..." />
          </div>
        </div>
        <div className="toolbar" style={{marginTop:10}}>
          <button className="btn btn-secondary" onClick={handleExport}>تصدير Excel / CSV</button>
          <button className="btn btn-primary" onClick={handlePrint}>طباعة التقرير</button>
        </div>
        {msg && <p className="card-sub" style={{marginTop:8}}>{msg}</p>}
        <p className="card-sub" style={{marginTop:6}}>لتصدير التقرير أدناه كملف PDF فعلي: عند الطباعة اختر «حفظ كـ PDF» وجهةً للطباعة بدل الطابعة.</p>
      </div>

      <div className="card print-sheet">
        <Letterhead title="سجل وإحصائيات الغياب" dateLine={rangeLabel} />
        <div className="stat-grid" style={{marginBottom:16}}>
          <StatCard label="إجمالي أيام الغياب المسجلة" value={stats.totalDays} />
          <StatCard label="إجمالي الحصص المهدرة" value={stats.totalPeriods} tone="danger" />
          <StatCard label="أكثر الأيام تسجيلاً للغياب" value={stats.topDay} />
        </div>
        {absenceEvents.length === 0 ? (
          <p className="empty-note">لا توجد حالات غياب مسجلة ضمن الفترة/البحث المحدد.</p>
        ) : (
          <div className="table-scroll">
            <table className="print-table">
              <thead>
                <tr>
                  <th>م</th>
                  <th>تاريخ الغياب</th>
                  <th>اليوم</th>
                  <th>{'اسم ' + labels.absentTeacher}</th>
                  <th>التخصص</th>
                  <th>عدد الحصص المهدرة</th>
                  <th>تفاصيل الفصول والمواد المتأثرة</th>
                </tr>
              </thead>
              <tbody>
                {absenceEvents.map((e,i) => (
                  <tr key={e.date + '|' + e.absentTeacherName + i}>
                    <td className="tabular">{i+1}</td>
                    <td className="tabular">{formatArabicDate(e.date)}</td>
                    <td>{e.day || '—'}</td>
                    <td>{e.absentTeacherName}</td>
                    <td>{e.subject}</td>
                    <td className="tabular">{e.periods}</td>
                    <td style={{fontSize:12}}>{e.details.join('، ')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <SignFooter />
      </div>
    </div>
  );
}

// ===== التقرير الثاني: سجل وإحصائيات إشغال حصص الانتظار =====
function SubstitutionReport({ teachers, assignments }){
  const { labels, driveUrl } = useSchool();
  const [preset, setPreset] = useState('week');
  const [fromDate, setFromDate] = useState(startOfWeekIso());
  const [toDate, setToDate] = useState(todayIso());
  const [search, setSearch] = useState('');
  const { copy, msg } = useClipboardCopy();

  const range = useMemo(() => computePresetRange(preset, fromDate, toDate), [preset, fromDate, toDate]);
  const rangeLabel = useMemo(() => rangeLabelOf(range), [range]);

  // الرصيد «حتى هذا التكليف تحديداً»: يُحتسب بترتيب زمني فعلي عبر كل تكليفات النظام (وليس فقط
  // ضمن الفترة المعروضة)، بحيث يعكس كل صف رصيد المعلم لحظة اعتماد ذلك التكليف بالذات، لا رصيده
  // النهائي الحالي المكرَّر في كل الصفوف.
  const balanceById = useMemo(() => {
    const sorted = [...assignments].sort((a,b) => (a.ts || 0) - (b.ts || 0));
    const counters = {};
    const map = {};
    sorted.forEach(a => {
      counters[a.teacherId] = (counters[a.teacherId] || 0) + 1;
      map[a.id] = counters[a.teacherId];
    });
    return map;
  }, [assignments]);

  const filteredAssignments = useMemo(() => assignments.filter(a => {
    if(range.from && a.date < range.from) return false;
    if(range.to && a.date > range.to) return false;
    if(search.trim() && !(a.teacherName || '').includes(search.trim())) return false;
    return true;
  }), [assignments, range, search]);

  const occupancyLog = useMemo(() => filteredAssignments
    .slice()
    .sort((a,b) => (a.date === b.date ? a.period - b.period : (a.date < b.date ? 1 : -1)))
    .map(a => ({ ...a, balance: balanceById[a.id] ?? '—' })),
  [filteredAssignments, balanceById]);

  const summaryRows = useMemo(() => {
    const counts = new Map();
    filteredAssignments.forEach(a => counts.set(a.teacherId, (counts.get(a.teacherId) || 0) + 1));
    return teachers
      .filter(t => !search.trim() || t.name.includes(search.trim()))
      .map(t => ({ teacher:t, periodCount: counts.get(t.id) || 0 }))
      .sort((a,b) => b.periodCount - a.periodCount);
  }, [teachers, filteredAssignments, search]);

  const stats = useMemo(() => {
    const total = filteredAssignments.length;
    const covered = new Set(filteredAssignments.map(a => a.teacherId)).size;
    const avg = covered ? (total / covered) : 0;
    return { total, covered, avg };
  }, [filteredAssignments]);

  const handleExport = () => {
    const csv = buildOccupancyReportCsv(occupancyLog);
    copy(csv, 'تم نسخ سجل الإشغال كنص CSV إلى الحافظة — الصقه في Excel أو Google Sheets.');
    archiveReportToCloud(driveUrl, 'سجل_الانتظار', 'كشف-إشغال-الانتظار', csv);
  };
  const handlePrint = () => {
    archiveReportToCloud(driveUrl, 'سجل_الانتظار', 'كشف-إشغال-الانتظار', buildOccupancyReportCsv(occupancyLog));
    window.print();
  };

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">{'لا توجد بيانات ' + labels.teachersOf + ' بعد.'}</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card no-print">
        <h3 className="card-title">سجل وإحصائيات إشغال حصص الانتظار</h3>
        <p className="card-sub">اختر فترة زمنية، واختيارياً ابحث باسم المعلم/ة المكلَّف/ة، لعرض سجل التكليفات وإحصائياتها، ثم اطبعها أو صدّرها.</p>
        <PeriodFilterBar idPrefix="occ" preset={preset} setPreset={setPreset} fromDate={fromDate} setFromDate={setFromDate} toDate={toDate} setToDate={setToDate} />
        <div className="toolbar" style={{marginTop:10}}>
          <div className="field" style={{maxWidth:260}}>
            <label className="field-label" htmlFor="occ-search">{'بحث باسم ' + labels.assignedTeacher}</label>
            <input id="occ-search" className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="اكتب جزءاً من الاسم..." />
          </div>
        </div>
        <div className="toolbar" style={{marginTop:10}}>
          <button className="btn btn-secondary" onClick={handleExport}>تصدير Excel / CSV</button>
          <button className="btn btn-primary" onClick={handlePrint}>طباعة الكشف الرسمي</button>
        </div>

// ===== التقرير الثالث: مؤشرات العدالة والعبء الإداري =====
function EquityReport({ teachers, assignments }){
  const { labels, driveUrl } = useSchool();
  const [preset, setPreset] = useState('term');
  const [fromDate, setFromDate] = useState(startOfWeekIso());
  const [toDate, setToDate] = useState(todayIso());
  const { copy, msg } = useClipboardCopy();

  const range = useMemo(() => computePresetRange(preset, fromDate, toDate), [preset, fromDate, toDate]);
  const rangeLabel = useMemo(() => rangeLabelOf(range), [range]);

  const filteredAssignments = useMemo(() => assignments.filter(a => {
    if(range.from && a.date < range.from) return false;
    if(range.to && a.date > range.to) return false;
    return true;
  }), [assignments, range]);

  // مؤشرات العدالة تُحسب حصراً على المعلمين/المعلمات القابلين للترشيح فعلياً (غير المستبعدين
  // إدارياً وغير أصحاب النصاب الكامل)، لأن غيرهم غير مرشَّح أصلاً لحصص الانتظار.
  const eligibleTeachers = useMemo(() => teachers.filter(t => !t.excluded && !isFullQuota(t.nisab)), [teachers]);

  const rows = useMemo(() => {
    const counts = new Map();
    filteredAssignments.forEach(a => counts.set(a.teacherId, (counts.get(a.teacherId) || 0) + 1));
    const avg = eligibleTeachers.length ? eligibleTeachers.reduce((s,t) => s + (counts.get(t.id) || 0), 0) / eligibleTeachers.length : 0;
    return eligibleTeachers
      .map(t => {
        const count = counts.get(t.id) || 0;
        return { teacher:t, count, deviation: count - avg };
      })
      .sort((a,b) => b.count - a.count);
  }, [eligibleTeachers, filteredAssignments]);

  const stats = useMemo(() => {
    const counts = rows.map(r => r.count);
    const avg = rows.length ? rows.reduce((s,r) => s + r.count, 0) / rows.length : 0;
    const max = counts.length ? Math.max(...counts) : 0;
    const min = counts.length ? Math.min(...counts) : 0;
    const excludedCount = teachers.filter(t => t.excluded).length;
    const fullQuotaCount = teachers.filter(t => isFullQuota(t.nisab)).length;
    return { avg, gap: max - min, excludedCount, fullQuotaCount };
  }, [rows, teachers]);

  const maxCount = Math.max(1, ...rows.map(r => r.count));

  const handleExport = () => {
    const csv = buildEquityReportCsv(rows);
    copy(csv, 'تم نسخ مؤشرات العدالة كنص CSV إلى الحافظة — الصقه في Excel أو Google Sheets.');
    archiveReportToCloud(driveUrl, 'مؤشرات_العدالة', 'مؤشرات-العدالة', csv);
  };
  const handlePrint = () => {
    archiveReportToCloud(driveUrl, 'مؤشرات_العدالة', 'مؤشرات-العدالة', buildEquityReportCsv(rows));
    window.print();
  };

  if(teachers.length === 0){
    return <div className="card"><p className="empty-note">{'لا توجد بيانات ' + labels.teachersOf + ' بعد.'}</p></div>;
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card no-print">
        <h3 className="card-title">مؤشرات العدالة والعبء الإداري</h3>
        <p className="card-sub">
          {'يقيس هذا التقرير مدى توازن توزيع حصص الانتظار بين ' + labels.teachersOf + ' القابلين للترشيح فعلياً (باستثناء المستبعدين إدارياً وأصحاب النصاب الكامل)، لرصد أي تفاوت يستدعي انتباه الإدارة.'}
        </p>
        <PeriodFilterBar idPrefix="eq" preset={preset} setPreset={setPreset} fromDate={fromDate} setFromDate={setFromDate} toDate={toDate} setToDate={setToDate} />
        <div className="toolbar" style={{marginTop:10}}>
          <button className="btn btn-secondary" onClick={handleExport}>تصدير Excel / CSV</button>
          <button className="btn btn-primary" onClick={handlePrint}>طباعة التقرير</button>
        </div>
        {msg && <p className="card-sub" style={{marginTop:8}}>{msg}</p>}
        <p className="card-sub" style={{marginTop:6}}>لتصدير التقرير أدناه كملف PDF فعلي: عند الطباعة اختر «حفظ كـ PDF» وجهةً للطباعة بدل الطابعة.</p>
      </div>

      <div className="card print-sheet">
        <Letterhead title="تقرير مؤشرات العدالة والعبء الإداري" dateLine={rangeLabel} />
        <div className="stat-grid" style={{marginBottom:16}}>
          <StatCard label={'متوسط الحصص المنفذة لـ' + labels.teacherDef + ' القابل للترشيح'} value={stats.avg.toFixed(1)} />
          <StatCard label="الفارق بين الأعلى والأقل تنفيذاً" value={stats.gap} tone={stats.gap > 3 ? 'danger' : undefined} />
          <StatCard label="مستبعدون إدارياً من الانتظار" value={stats.excludedCount} />
          <StatCard label="أصحاب نصاب كامل (24)" value={stats.fullQuotaCount} />
        </div>
        {rows.length === 0 ? (
          <p className="empty-note">{'لا يوجد ' + labels.teachersOf + ' قابلون للترشيح حالياً لعرض مؤشرات العدالة.'}</p>
        ) : (
          <div className="table-scroll">
            <table className="print-table">
              <thead>
                <tr>
                  <th>{labels.teacherDef}</th><th>النصاب</th><th>حصص الانتظار المنفذة بالفترة</th><th>الانحراف عن المتوسط</th><th>مؤشر العدالة</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.teacher.id}>
                    <td>{r.teacher.name}</td>
                    <td className="tabular">{r.teacher.nisab}</td>
                    <td className="tabular">{r.count}</td>
                    <td className="tabular" style={{color: r.deviation > 0 ? 'var(--danger)' : (r.deviation < 0 ? 'var(--accent)' : undefined)}}>
                      {(r.deviation > 0 ? '+' : '') + r.deviation.toFixed(1)}
                    </td>
                    <td>
                      <div className="bar-track"><div className="bar-fill" style={{width:(r.count/maxCount*100)+'%'}} /></div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <p className="card-sub" style={{marginTop:10}}>
          {'المتوسط والانحراف محسوبان على ' + labels.teachersOf + ' القابلين للترشيح فقط (' + rows.length + ' من ' + teachers.length + ')؛ المستبعدون إدارياً وأصحاب النصاب الكامل مستثنون من هذا الحساب لأنهم غير مرشَّحين أصلاً لحصص الانتظار.'}
        </p>
        <SignFooter />
      </div>
    </div>
  );
}

function PdfImportPanel({ onMergeTeachers }){
  const [status, setStatus] = useState('idle');
  const [progress, setProgress] = useState(0);
  const [progressLabel, setProgressLabel] = useState('');
  const [candidates, setCandidates] = useState([]);
  const [failedPages, setFailedPages] = useState([]);
  const [reviewOpen, setReviewOpen] = useState(false);
  const [mergeMode, setMergeMode] = useState('append');
  const [pasteText, setPasteText] = useState('');
  const [pasteTarget, setPasteTarget] = useState(null);
  const [globalError, setGlobalError] = useState('');
  const fileInputRef = useRef(null);

  const processFiles = useCallback(async (fileList) => {
    setGlobalError('');
    setCandidates([]);
    setFailedPages([]);
    setStatus('loading-lib');
    setProgress(0);
    setProgressLabel('جاري تحميل محرك قراءة PDF...');

    let pdfjsLib;
    try{
      pdfjsLib = await loadPdfJs();
    }catch(err){
      setStatus('error');
      setGlobalError('تعذر تحميل محرك قراءة PDF (' + err.message + ') — يمكنك استخدام استيراد Excel/CSV بدلاً من ذلك.');
      return;
    }

    setStatus('processing');
    const files = Array.from(fileList);
    const docs = [];
    const openFailures = [];
    for(const file of files){
      try{
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf, disableWorker: true }).promise;
        docs.push({ file, pdf });
      }catch(err){
        openFailures.push({ sourceLabel: file.name, reason: 'تعذر فتح الملف: ' + err.message });
      }
    }

    const totalPages = docs.reduce((s,d) => s + d.pdf.numPages, 0) || 1;
    let processed = 0;
    const newCandidates = [];
    const newFailed = [...openFailures];

    for(const { file, pdf } of docs){
      for(let i=1; i<=pdf.numPages; i++){
        const sourceLabel = file.name + (pdf.numPages > 1 ? (' — صفحة ' + i) : '');
        setProgressLabel('جاري تحليل: ' + sourceLabel);
        try{
          const page = await pdf.getPage(i);
          const result = await extractTeacherFromPage(page);
          if(result.ok){
            newCandidates.push({
              tempId: uid('pdf'), name: result.name, subject: result.subject, nisab: result.nisab,
              schedule: result.schedule, phone: '', sourceLabel
            });
          } else {
            newFailed.push({ sourceLabel, reason: result.reason, partialName: result.partialName || '' });
          }
        }catch(err){
          newFailed.push({ sourceLabel, reason: 'خطأ أثناء المعالجة: ' + err.message });
        }
        processed++;
        setProgress(Math.round(processed / totalPages * 100));
      }
    }

    setCandidates(newCandidates);
    setFailedPages(newFailed);
    setStatus('done');
    setProgressLabel('اكتملت المعالجة');
    if(newCandidates.length > 0) setReviewOpen(true);
  }, []);

  const updateCandidateField = (tempId, field, value) => {
    setCandidates(prev => prev.map(c => c.tempId === tempId ? { ...c, [field]: value } : c));
  };

  const toggleCandidateCell = (tempId, day, period) => {
    setCandidates(prev => prev.map(c => {
      if(c.tempId !== tempId) return c;
      const daySchedule = { ...c.schedule[day], [period]: { ...c.schedule[day][period], busy: !c.schedule[day][period].busy } };
      const schedule = { ...c.schedule, [day]: daySchedule };
      let nisab = 0;
      DAYS.forEach(d => PERIODS.forEach(p => { if(schedule[d][p].busy) nisab++; }));
      return { ...c, schedule, nisab };
    }));
  };

  const removeCandidate = (tempId) => setCandidates(prev => prev.filter(c => c.tempId !== tempId));

  const commitCandidates = () => {
    const finalTeachers = candidates.map(c => ({
      id: uid('t'), name: c.name.trim() || 'معلم بدون اسم', subject: c.subject.trim() || '—',
      nisab: c.nisab, phone: '', substituteCount: 0, schedule: c.schedule
    }));
    onMergeTeachers(finalTeachers, mergeMode);
    setReviewOpen(false);
    setCandidates([]);
    setStatus('idle');
  };

  const applyPasteFallback = (failedIdx) => {
    try{
      const { schedule, nisab } = parsePastedScheduleText(pasteText);
      const failedItem = failedPages[failedIdx];
      setCandidates(prev => [...prev, {
        tempId: uid('pdf'), name: failedItem.partialName || 'معلم (من نص ملصق)', subject:'',
        nisab, schedule, phone:'', sourceLabel: failedItem.sourceLabel + ' (نص ملصق)'
      }]);
      setFailedPages(prev => prev.filter((_,i) => i !== failedIdx));
      setPasteText('');
      setPasteTarget(null);
      setReviewOpen(true);
    }catch(err){
      setGlobalError('تعذر تحليل النص الملصق: ' + err.message);
    }
  };

  const busy = status === 'loading-lib' || status === 'processing';

  return (
    <div className="card">
      <h3 className="card-title">استيراد ذكي من ملفات PDF</h3>
      <p className="card-sub">ارفع ملف PDF واحد يحوي صفحة لكل معلم، أو عدة ملفات PDF معاً. يحاول النظام استخراج الاسم والتخصص وجدول الحصص تلقائياً — مع مراجعة واعتماد قبل الحفظ في كل الأحوال.</p>

      <div className="drop-zone">
        <p style={{fontWeight:700}}>اختر ملف أو أكثر بصيغة PDF</p>
        <p className="card-sub" style={{marginBottom:12}}>صفحة واحدة لكل معلم (جدول aSc أو مشابه)، يدعم الرفع الجماعي</p>
        <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={busy}>
          {busy ? 'جاري المعالجة...' : 'اختيار ملفات PDF'}
        </button>
        <input ref={fileInputRef} type="file" accept="application/pdf" multiple style={{display:'none'}} onChange={e => { if(e.target.files && e.target.files.length) processFiles(e.target.files); e.target.value = ''; }} />
      </div>

      {busy && (
        <div style={{marginTop:14}}>
          <div className="bar-track"><div className="bar-fill" style={{width:progress+'%'}} /></div>
          <p className="card-sub tabular" style={{marginTop:6}}>{progressLabel} — {progress}%</p>
        </div>
      )}

      {globalError && <p style={{marginTop:10, color:'var(--danger)', fontWeight:600, fontSize:13.5}}>{globalError}</p>}

      {status === 'done' && (
        <div style={{marginTop:12}}>
          <p className="card-sub tabular" style={{margin:0}}>
            تم استخراج {candidates.length} معلم بنجاح{failedPages.length > 0 ? (' — وتعذّر استخراج ' + failedPages.length + ' صفحة/ملف') : ''}
          </p>
          {candidates.length > 0 && (
            <button className="btn btn-secondary btn-sm" style={{marginTop:8}} onClick={() => setReviewOpen(true)}>فتح شاشة المراجعة والاعتماد</button>
          )}
        </div>
      )}

      {failedPages.length > 0 && (
        <div style={{marginTop:14, borderTop:'1px solid var(--border)', paddingTop:12}}>
          <p className="field-label" style={{margin:'0 0 8px'}}>صفحات تعذّر تحليلها تلقائياً</p>
          {failedPages.map((f,i) => (
            <div key={i} className="pdf-fail-item">
              <p style={{margin:'0 0 4px', fontWeight:700, fontSize:13}}>{f.sourceLabel}</p>
              <p style={{margin:'0 0 8px', fontSize:12.5, color:'var(--muted)'}}>{f.reason}</p>
              {pasteTarget === i ? (
                <div>
                  <textarea className="json-box" style={{minHeight:110}} value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="الصق هنا نص الجدول (يفضَّل أن يتضمن أسماء الأيام وأرقام الحصص ١-٧)" />
                  <div style={{display:'flex', gap:8, marginTop:6, flexWrap:'wrap'}}>
                    <button className="btn btn-primary btn-sm" onClick={() => applyPasteFallback(i)}>تحليل النص الملصق</button>
                    <button className="btn btn-secondary btn-sm" onClick={() => { setPasteTarget(null); setPasteText(''); }}>إلغاء</button>
                  </div>
                </div>
              ) : (
                <button className="btn btn-secondary btn-sm" onClick={() => { setPasteTarget(i); setPasteText(''); }}>لصق نص الجدول يدوياً</button>
              )}
            </div>
          ))}

        </div>
      )}
    </div>
  );
}

function WordImportPanel({ teachers, onApplyTimetable, onMergeTeachers }){
  const { notify } = useSchool();
  const fileInputRef = useRef(null);
  const [status, setStatus] = useState('idle'); // idle | parsing | done | error
  const [error, setError] = useState('');
  const [result, setResult] = useState(null); // { mode:'timetable', rows } | { mode:'roster', teachers }
  const [reviewOpen, setReviewOpen] = useState(false);
  const [createMissing, setCreateMissing] = useState(true);
  const [mergeMode, setMergeMode] = useState('append');

  const handleFile = useCallback((file) => {
    if(!file) return;
    setError(''); setResult(null); setStatus('parsing');
    const reader = new FileReader();
    reader.onload = async (e) => {
      try{
        const parsed = await parseWordDocument(e.target.result);
        setResult(parsed);
        setStatus('done');
        setReviewOpen(true);
      }catch(err){
        setStatus('error');
        setError(err.message || 'تعذر تحليل ملف Word.');
      }
    };
    reader.onerror = () => { setStatus('error'); setError('تعذرت قراءة الملف.'); };
    reader.readAsArrayBuffer(file);
  }, []);

  const matchReport = useMemo(() => {
    if(!result || result.mode !== 'timetable') return null;
    const rosterNames = new Set(teachers.map(t => normalizeTeacherName(t.name)));
    const matched = result.rows.filter(r => rosterNames.has(normalizeTeacherName(r.name)));
    const unmatched = result.rows.filter(r => !rosterNames.has(normalizeTeacherName(r.name)));
    return { matched, unmatched };
  }, [result, teachers]);

  const commitTimetable = () => {
    onApplyTimetable(result.rows, { createMissing });
    setReviewOpen(false);
    notify('تم تطبيق الجدول المستورد من ملف Word بنجاح.');
  };

  const commitRoster = () => {
    onMergeTeachers(result.teachers, mergeMode);
    setReviewOpen(false);
  };

  return (
    <div className="card">
      <h3 className="card-title">استيراد عام من ملف Word (.docx)</h3>
      <p className="card-sub">
        يحاول النظام التعرّف تلقائياً على أي جدول Word حقيقي (محرَّر عبر Insert ← Table في برنامج Word، لا نصاً
        حراً أو صورة) إما كجدول عام للفراغ/الإشغال (بوجود صف أسماء الأيام الخمسة وأرقام الحصص ١-٧، بنفس تنسيق
        تصدير aSc)، أو كقائمة معلمين بقالب الأعمدة القياسي (الاسم، التخصص، النصاب...) إن كان الصف الأول رؤوس
        أعمدة. دعم عام يغطي أشكال جداول متعددة دون نموذج واحد محدَّد مسبقاً — استيراد Excel/CSV يبقى الأدق
        والأكثر توصية عند توفره.
      </p>
      <div className="drop-zone">
        <p style={{fontWeight:700}}>اختر ملف Word (.docx)</p>
        <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={status==='parsing'}>
          {status==='parsing' ? 'جاري التحليل...' : 'اختيار ملف Word'}
        </button>
        <input ref={fileInputRef} type="file" accept=".docx" style={{display:'none'}} onChange={e => { if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
      </div>
      {error && <p style={{marginTop:10, color:'var(--danger)', fontWeight:600, fontSize:13.5}}>{error}</p>}
      {status==='done' && result && !reviewOpen && (
        <div style={{marginTop:12}}>
          <p className="card-sub tabular" style={{margin:0}}>
            {result.mode==='timetable'
              ? 'تم تحليل الملف كجدول عام — ' + result.rows.length + ' صف معلم.'
              : 'تم تحليل الملف كقائمة معلمين — ' + result.teachers.length + ' معلم.'}
          </p>
          <button className="btn btn-secondary btn-sm" style={{marginTop:8}} onClick={() => setReviewOpen(true)}>فتح شاشة المراجعة</button>
        </div>
      )}

      {reviewOpen && result && result.mode === 'timetable' && (
        <div className="modal-backdrop no-print" role="dialog" aria-modal="true" aria-label="مراجعة الجدول المستورد من Word">
          <div className="modal-panel">
            <div className="modal-header">
              <h3 className="card-title" style={{margin:0}}>مراجعة الجدول المستورد من Word</h3>
              <button className="btn btn-secondary btn-sm" onClick={() => setReviewOpen(false)}>إغلاق</button>
            </div>
            <div style={{display:'flex', gap:10, flexWrap:'wrap', marginBottom:12}}>
              <span className="badge badge-count tabular">تطابق تام: {matchReport ? matchReport.matched.length : 0}</span>
              <span className="badge badge-danger tabular">بدون تطابق: {matchReport ? matchReport.unmatched.length : 0}</span>
            </div>
            {matchReport && matchReport.unmatched.length > 0 && (
              <div style={{marginBottom:12}}>
                <p className="field-label">أسماء وردت في الملف ولم يُعثر لها على تطابق في قائمة المعلمين الحالية</p>
                <p className="card-sub">{matchReport.unmatched.map(r => r.name).join('، ')}</p>
                <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, fontWeight:600, marginTop:6}}>

              <button className="btn btn-secondary btn-sm" onClick={() => setReviewOpen(false)}>إغلاق</button>
            </div>
            <p className="card-sub">تم التعرّف على {result.teachers.length} معلم وفق قالب الأعمدة القياسي (الاسم، التخصص، النصاب، رقم الجوال، وجدول الحصص إن وُجد).</p>
            <div className="toolbar" style={{marginTop:14, borderTop:'1px solid var(--border)', paddingTop:14}}>
              <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, fontWeight:600}}>
                <input type="radio" name="word-merge-mode" checked={mergeMode==='append'} onChange={() => setMergeMode('append')} />
                إضافة إلى قائمة المعلمين الحالية
              </label>
              <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, fontWeight:600}}>
                <input type="radio" name="word-merge-mode" checked={mergeMode==='replace'} onChange={() => setMergeMode('replace')} />
                استبدال جميع المعلمين الحاليين
              </label>
              <button className="btn btn-primary" onClick={commitRoster} disabled={result.teachers.length===0}>اعتماد وحفظ في النظام</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AscXmlImportPanel({ onUpsertProfiles }){
  const fileInputRef = useRef(null);
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');
  const [profiles, setProfiles] = useState([]);
  const [sheetNameFound, setSheetNameFound] = useState('');
  const [reviewOpen, setReviewOpen] = useState(false);

  const handleFile = useCallback((file) => {
    if(!file) return;
    setError('');
    setStatus('parsing');
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const { sheetName, profiles: extracted } = parseAscTeacherXml(e.target.result);
        setSheetNameFound(sheetName);
        const withPhones = extracted.map(p => {
          const subjSummary = summarizeAscSubjects(p.details);
          return {
            tempId: p.tempId,
            name: p.name,
            nisab: p.nisab,
            subject: subjSummary.length ? subjSummary[0][0] : '—',
            subjectsLabel: subjSummary.map(([s,total]) => s + ' (' + total + ')').join('، '),
            phone: ''
          };
        });
        setProfiles(withPhones);
        setStatus('done');
        setReviewOpen(true);
      }catch(err){
        setStatus('error');
        setError(err.message || 'تعذر تحليل الملف.');
      }
    };
    reader.onerror = () => { setStatus('error'); setError('تعذرت قراءة الملف.'); };
    reader.readAsText(file, 'UTF-8');
  }, []);

  const updatePhone = (tempId, phone) => {
    setProfiles(prev => prev.map(p => p.tempId === tempId ? { ...p, phone } : p));
  };

  const commit = () => {
    onUpsertProfiles(profiles.map(p => ({ name: p.name, nisab: p.nisab, subject: p.subject, phone: p.phone })));
    setReviewOpen(false);
  };

  const fullCount = profiles.filter(p => isFullQuota(p.nisab)).length;

  return (
    <div className="card">
      <h3 className="card-title">المسار الأول — استيراد وتحديث سجلات المعلمين (aSc XML)</h3>
      <p className="card-sub">
        ارفع ملف تصدير aSc Timetables بصيغة Excel Spreadsheet 2003 XML (مثل 13.xml). يقرأ النظام تلقائياً ورقة
        «1 اسناد_المعلم» ويستخرج اسم كل معلم ونصابه الكلي اعتماداً على البنية الفعلية للملف، ثم يعرضها للمراجعة
        قبل الحفظ مع إمكانية إضافة رقم الجوال لكل معلم.
      </p>
      <div className="drop-zone">
        <p style={{fontWeight:700}}>اختر ملف XML المُصدَّر من aSc</p>
        <p className="card-sub" style={{marginBottom:12}}>الصيغة المدعومة: .xml (Excel Spreadsheet 2003 XML)</p>
        <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={status==='parsing'}>
          {status==='parsing' ? 'جاري التحليل...' : 'اختيار ملف XML'}
        </button>
        <input ref={fileInputRef} type="file" accept=".xml" style={{display:'none'}} onChange={e => { if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
      </div>
      {error && <p style={{marginTop:10, color:'var(--danger)', fontWeight:600, fontSize:13.5}}>{error}</p>}
      {status==='done' && !reviewOpen && (
        <div style={{marginTop:12}}>
          <p className="card-sub tabular" style={{margin:0}}>
            تم استخراج {profiles.length} معلم من ورقة «{sheetNameFound}» ({fullCount} منهم بنصاب كامل ويُستبعدون تلقائياً من ترشيح الانتظار).
          </p>
          <button className="btn btn-secondary btn-sm" style={{marginTop:8}} onClick={() => setReviewOpen(true)}>فتح شاشة المراجعة</button>
        </div>
      )}

      {reviewOpen && (
        <div className="modal-backdrop no-print" role="dialog" aria-modal="true" aria-label="مراجعة سجلات المعلمين">
          <div className="modal-panel">
            <div className="modal-header">
              <h3 className="card-title" style={{margin:0}}>مراجعة سجلات المعلمين ({profiles.length})</h3>
              <button className="btn btn-secondary btn-sm" onClick={() => setReviewOpen(false)}>إغلاق</button>
            </div>
            <p className="card-sub">تحقق من الأسماء والأنصبة المستخرجة، وأضف رقم الجوال لكل معلم إن رغبت، ثم اعتمد الحفظ. سيتم تحديث بيانات المعلم الموجود مسبقاً بنفس الاسم بدقة، أو إنشاء سجل جديد له إن لم يكن موجوداً.</p>
            <div className="table-scroll" style={{maxHeight:'50vh'}}>
              <table className="matrix">
                <thead>
                  <tr>
                    <th className="name-head">الاسم</th>
                    <th>النصاب</th>
                    <th>المواد المسندة</th>
                    <th>رقم الجوال</th>
                  </tr>
                </thead>
                <tbody>
                  {profiles.map(p => (
                    <tr key={p.tempId}>
                      <td className="name-cell">{p.name}{isFullQuota(p.nisab) && <span className="badge badge-danger" style={{marginRight:6, fontSize:10.5}}>نصاب كامل</span>}</td>
                      <td className="tabular">{p.nisab}</td>
                      <td style={{fontSize:12.5, color:'var(--muted)'}}>{p.subjectsLabel}</td>
                      <td><input className="phone-input" value={p.phone} onChange={e => updatePhone(p.tempId, e.target.value)} placeholder="05xxxxxxxx" /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="toolbar" style={{marginTop:14, borderTop:'1px solid var(--border)', paddingTop:14}}>
              <button className="btn btn-primary" onClick={commit} disabled={profiles.length===0}>حفظ وتحديث أرقام الجوال</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function GeneralTimetableImportPanel({ teachers, onApplyTimetable }){
  const fileInputRef = useRef(null);
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');
  const [parsedRows, setParsedRows] = useState([]);
  const [sheetName, setSheetName] = useState('');
  const [createMissing, setCreateMissing] = useState(true);
  const [reviewOpen, setReviewOpen] = useState(false);

  const handleFile = useCallback((file) => {
    if(!file) return;
    setError('');
    setStatus('parsing');
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const { sheetName: name, rows } = parseGeneralTimetableWorkbook(wb);
        if(rows.length === 0) throw new Error('لم يتم العثور على أي صف معلم أسفل رؤوس الأيام والحصص.');
        setSheetName(name);
        setParsedRows(rows);
        setStatus('done');
        setReviewOpen(true);
      }catch(err){
        setStatus('error');
        setError(err.message || 'تعذر تحليل الملف.');
      }
    };
    reader.onerror = () => { setStatus('error'); setError('تعذرت قراءة الملف.'); };
    reader.readAsArrayBuffer(file);
  }, []);

  const matchReport = useMemo(() => {
    const rosterNames = new Set(teachers.map(t => normalizeTeacherName(t.name)));
    const matched = parsedRows.filter(r => rosterNames.has(normalizeTeacherName(r.name)));
    const unmatched = parsedRows.filter(r => !rosterNames.has(normalizeTeacherName(r.name)));
    const timetableNames = new Set(parsedRows.map(r => normalizeTeacherName(r.name)));
    const missingFromTimetable = teachers.filter(t => !timetableNames.has(normalizeTeacherName(t.name)));
    return { matched, unmatched, missingFromTimetable };
  }, [parsedRows, teachers]);

  const commit = () => {
    onApplyTimetable(parsedRows, { createMissing });
    setReviewOpen(false);
  };

  return (
    <div className="card">
      <h3 className="card-title">المسار الثاني — استيراد الجدول المدرسي العام (فراغ / إشغال)</h3>
      <p className="card-sub">
        ارفع ملف الجدول العام بصيغة Excel (مثل timetable.xlsx) وورقة باسم «الجدول العام للمعلمين». يتعرّف النظام
        تلقائياً على أسماء الأيام الخمسة وأرقام الحصص ١-٧ أسفل كل يوم، ثم يطابق كل معلم مع سجله المستورد من المسار
        الأول ويحدّث حصص فراغه وإشغاله فوراً.
      </p>
      <div className="drop-zone">
        <p style={{fontWeight:700}}>اختر ملف الجدول العام</p>
        <p className="card-sub" style={{marginBottom:12}}>الصيغة المدعومة: .xlsx, .xls</p>
        <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={status==='parsing'}>
          {status==='parsing' ? 'جاري التحليل...' : 'اختيار ملف الجدول العام'}
        </button>
        <input ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e => { if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
      </div>
      {error && <p style={{marginTop:10, color:'var(--danger)', fontWeight:600, fontSize:13.5}}>{error}</p>}
      {status==='done' && !reviewOpen && (
        <div style={{marginTop:12}}>
          <p className="card-sub tabular" style={{margin:0}}>تم تحليل {parsedRows.length} صف معلم من ورقة «{sheetName}».</p>
          <button className="btn btn-secondary btn-sm" style={{marginTop:8}} onClick={() => setReviewOpen(true)}>فتح شاشة المراجعة والمطابقة</button>
        </div>
      )}

      {reviewOpen && (
        <div className="modal-backdrop no-print" role="dialog" aria-modal="true" aria-label="مراجعة الجدول العام">
          <div className="modal-panel">
            <div className="modal-header">
              <h3 className="card-title" style={{margin:0}}>مراجعة مطابقة الجدول العام</h3>
              <button className="btn btn-secondary btn-sm" onClick={() => setReviewOpen(false)}>إغلاق</button>
            </div>
            <div style={{display:'flex', gap:10, flexWrap:'wrap', marginBottom:12}}>
              <span className="badge badge-count tabular">تطابق تام: {matchReport.matched.length}</span>
              <span className="badge badge-danger tabular">بدون تطابق في القائمة: {matchReport.unmatched.length}</span>
              <span className="badge badge-count tabular">معلمون بلا جدول في هذا الملف: {matchReport.missingFromTimetable.length}</span>
            </div>

            {matchReport.unmatched.length > 0 && (
              <div style={{marginBottom:12}}>
                <p className="field-label">أسماء وردت في الجدول العام ولم يُعثر لها على تطابق في قائمة المعلمين الحالية</p>
                <p className="card-sub">{matchReport.unmatched.map(r => r.name).join('، ')}</p>
                <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, fontWeight:600, marginTop:6}}>
                  <input type="checkbox" checked={createMissing} onChange={e => setCreateMissing(e.target.checked)} />
                  إنشاء سجل معلم جديد تلقائياً لهذه الأسماء (نصاب مبدئي = عدد حصصه المشغولة في هذا الملف)
                </label>
              </div>
            )}

            {matchReport.missingFromTimetable.length > 0 && (
              <div style={{marginBottom:12}}>
                <p className="field-label">معلمون في القائمة الحالية لم يُعثر لهم على جدول ضمن هذا الملف</p>
                <p className="card-sub">{matchReport.missingFromTimetable.map(t => t.name).join('، ')}</p>
              </div>
            )}

            <div className="toolbar" style={{marginTop:14, borderTop:'1px solid var(--border)', paddingTop:14}}>
              <button className="btn btn-primary" onClick={commit} disabled={parsedRows.length===0}>تطبيق الجدول على النظام</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
