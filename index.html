    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        const parsed = parseImportedRows(rows);
        onImportTeachers(parsed);
        setImportMsg({ type:'success', text: 'تم استيراد ' + parsed.length + ' معلم بنجاح.' });
      }catch(err){
        setImportMsg({ type:'error', text: 'تعذر قراءة الملف: ' + err.message });
      }
    };
    reader.onerror = () => setImportMsg({ type:'error', text:'تعذرت قراءة الملف.' });
    reader.readAsArrayBuffer(file);
  }, [onImportTeachers]);

  const handlePhoneFile = useCallback((file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
        const updates = parsePhoneUpdates(rows);
        const result = onImportPhones(updates);
        let text = 'تم تحديث رقم الجوال لـ ' + result.matched + ' معلم.';
        if(result.unmatched.length){
          text += ' لم يُعثر على تطابق اسم لـ: ' + result.unmatched.slice(0,5).join('، ') + (result.unmatched.length > 5 ? ' ...' : '');
        }
        setPhoneMsg({ type:'success', text });
      }catch(err){
        setPhoneMsg({ type:'error', text:'تعذر قراءة الملف: ' + err.message });
      }
    };
    reader.onerror = () => setPhoneMsg({ type:'error', text:'تعذرت قراءة الملف.' });
    reader.readAsArrayBuffer(file);
  }, [onImportPhones]);

  const downloadPhoneOrderTemplate = () => {
    const text = buildPhoneOrderTemplateCsv(teachers);
    setPhoneOrderTemplateText(text);
    copy(text, 'تم نسخ نموذج أرقام الجوال بترتيب البرنامج الحالي — الصقه في Excel، عبّئ عمود "رقم_الجوال" فقط، ثم ارفعه أدناه.');
  };

  const handlePhoneOrderFile = useCallback((file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
        const { updates, invalid } = parsePhoneOrderUpdates(rows, teachers.length);
        const result = onImportPhonesByOrder(updates);
        let text = 'تم تحديث رقم الجوال لـ ' + result.updated + ' معلم حسب الترتيب، دون أي تغيير آخر.';
        if(invalid.length) text += ' (تم تجاوز ' + invalid.length + ' صف برقم ترتيب غير صالح)';
        setPhoneOrderMsg({ type:'success', text });
      }catch(err){
        setPhoneOrderMsg({ type:'error', text:'تعذر قراءة الملف: ' + err.message });
      }
    };
    reader.onerror = () => setPhoneOrderMsg({ type:'error', text:'تعذرت قراءة الملف.' });
    reader.readAsArrayBuffer(file);
  }, [onImportPhonesByOrder, teachers.length]);

  const copyTemplate = () => copy(templateHeaders.join(','), 'تم نسخ رؤوس الأعمدة — الصقها في السطر الأول من ملفك.');

  // زر «تصدير نسخة احتياطية كاملة (JSON)»: يولّد حِمل النسخة الاحتياطية الكامل (buildFullBackup)
  // ويحاول تنزيله فعلياً كملف باسم يحمل اسم المدرسة والتاريخ (tryDownloadJsonFile) — يعمل تلقائياً
  // عند تشغيل الملف محلياً أو على أي استضافة عادية. يُستكمل دائماً بنسخ النص كاملاً إلى الحافظة وعرضه
  // في مربع النص أدناه كبديل مضمون يعمل حتى داخل بيئات المعاينة التي تحجب التنزيل الفعلي.
  const handleFullExport = async () => {
    const backup = buildFullBackup(teachers, assignments, settings);
    const text = JSON.stringify(backup, null, 2);
    const fileName = buildBackupFileName(settings);
    setJsonText(text);
    const result = await performBackupDownload(text, fileName);
    let statusMsg;
    if(result.mode === 'capability' && result.status === 'saved'){
      statusMsg = 'تم حفظ الملف (' + fileName + ') على جهازك بنجاح.';
    } else if(result.mode === 'capability' && result.status === 'declined'){
      statusMsg = 'تم إلغاء عملية الحفظ. النسخة الاحتياطية منسوخة إلى الحافظة وموجودة في المربع أدناه.';
    } else if(result.mode === 'blob' && result.attempted){
      statusMsg = 'تم تنزيل الملف (' + fileName + ') ونسخ محتواه احتياطاً إلى الحافظة أيضاً.';
    } else {
      statusMsg = 'تعذر التنزيل التلقائي في بيئة المعاينة الحالية — تم نسخ النسخة الاحتياطية الكاملة إلى الحافظة ووضعها في المربع أدناه؛ احفظها في ملف نصي باسم «' + fileName + '».';
    }
    copy(text, statusMsg);
    notify('تم تجهيز نسخة احتياطية كاملة: ' + teachers.length + ' ' + (teachers.length===1 ? labels.teacher : labels.teachers) + ' و' + assignments.length + ' تكليف.');
  };

  const handleFullBackupFile = (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = JSON.parse(e.target.result);
        const result = onImportBackup(parsed);
        setImportMsg({ type:'success', text:'تم استرجاع النسخة الاحتياطية بنجاح.' });
        notify('تمت استعادة ' + result.teachersCount + ' ' + (result.teachersCount===1 ? labels.teacher : labels.teachers) + ' و' + result.assignmentsCount + ' تكليف بنجاح.');
      }catch(err){
        setImportMsg({ type:'error', text: err.message || 'ملف JSON غير صالح أو غير متوافق مع نظام نُواب.' });
      }
    };
    reader.onerror = () => setImportMsg({ type:'error', text:'تعذرت قراءة الملف.' });
    reader.readAsText(file);
  };

  const importFromTextarea = () => {
    try{
      const parsed = JSON.parse(jsonText);
      const result = onImportBackup(parsed);
      setImportMsg({ type:'success', text:'تم استرجاع البيانات من النص بنجاح.' });
      notify('تمت استعادة ' + result.teachersCount + ' ' + (result.teachersCount===1 ? labels.teacher : labels.teachers) + ' و' + result.assignmentsCount + ' تكليف بنجاح.');
    }catch(err){
      setImportMsg({ type:'error', text: err.message || 'تعذر تحليل النص كـ JSON صالح.' });
    }
  };

  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div className="card backup-card">
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, flexWrap:'wrap', marginBottom:4}}>
          <h3 className="card-title" style={{margin:0}}>النسخ الاحتياطي ونقل البيانات</h3>
          <span className="badge badge-accent tabular">{formatSavedAtBadge(lastSavedAt)}</span>
        </div>
        <p className="card-sub">
          احفظ نسخة كاملة من بيانات النظام — إعدادات المدرسة والشعاران، قائمة {labels.teachersOf} وأنصبتهم وأرقام جوالهم واستثناءاتهم الإدارية،
          الجداول الأسبوعية الكاملة بما فيها أي تعديل يدوي، وسجل التكليفات التاريخي الكامل بعدادات الانتظار التراكمية — في ملف JSON واحد،
          وانقلها بسهولة إلى أي جهاز أو متصفح جديد.
        </p>
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <button className="btn btn-backup-export" onClick={handleFullExport}>⬇ تصدير نسخة احتياطية كاملة (JSON)</button>
          <button className="btn btn-backup-import" onClick={() => fullBackupFileInputRef.current && fullBackupFileInputRef.current.click()}>⬆ استيراد نسخة احتياطية</button>
          <input ref={fullBackupFileInputRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={e => { handleFullBackupFile(e.target.files[0]); e.target.value=''; }} />
        </div>
        {copyMsg && <p className="card-sub" style={{marginTop:8}}>{copyMsg}</p>}
        {importMsg && (
          <p style={{marginTop:8, color: importMsg.type==='error' ? 'var(--danger)' : 'var(--accent)', fontWeight:600, fontSize:13.5}}>{importMsg.text}</p>
        )}
        <details style={{marginTop:12}}>
          <summary style={{cursor:'pointer', fontSize:12.5, fontWeight:700, color:'var(--muted)'}}>خيارات متقدمة: نسخ/لصق النص يدوياً</summary>
          <div style={{marginTop:10}}>
            <label className="field-label" htmlFor="json-box">محتوى النسخة الاحتياطية (يُملأ تلقائياً عند التصدير، أو الصق هنا نص نسخة احتياطية لاسترجاعها)</label>
            <textarea id="json-box" className="json-box" value={jsonText} onChange={e=>setJsonText(e.target.value)} placeholder='{"teachers": [...], "assignments": [...]}' />
            <div style={{display:'flex', gap:10, flexWrap:'wrap', marginTop:8}}>
              <button className="btn btn-primary btn-sm" onClick={importFromTextarea}>استرجاع من النص أعلاه</button>
            </div>
          </div>
        </details>
      </div>

      <AscXmlImportPanel onUpsertProfiles={onUpsertProfiles} />
      <GeneralTimetableImportPanel teachers={teachers} onApplyTimetable={onApplyTimetable} />

      <div style={{display:'flex', alignItems:'center', gap:10, margin:'6px 0'}}>
        <div style={{flex:1, height:1, background:'var(--border)'}} />
        <span className="card-sub" style={{margin:0, whiteSpace:'nowrap'}}>خيارات استيراد إضافية</span>
        <div style={{flex:1, height:1, background:'var(--border)'}} />
      </div>

      <div className="card">
        <h3 className="card-title">استيراد جدول من Excel أو CSV</h3>
        <p className="card-sub">يدعم النظام ملفات .xlsx و .csv وفق القالب أدناه (يمكن تجهيزه من مخرجات aSc Timetables بإعادة ترتيب الأعمدة)</p>
        <div className="drop-zone">
          <p style={{fontWeight:700}}>اسحب الملف هنا أو اختره من جهازك</p>
          <p className="card-sub" style={{marginBottom:12}}>الصيغ المدعومة: xlsx, xls, csv</p>
          <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()}>اختيار ملف</button>
          <input ref={fileInputRef} id="file-import" type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />
        </div>
        {importMsg && (
          <p style={{marginTop:10, color: importMsg.type==='error' ? 'var(--danger)' : 'var(--accent)', fontWeight:600, fontSize:13.5}}>{importMsg.text}</p>
        )}
        <div style={{marginTop:14}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, flexWrap:'wrap'}}>
            <span className="field-label" style={{margin:0}}>قالب الأعمدة المطلوب (صف واحد لكل معلم)</span>
            <button className="btn btn-secondary btn-sm" onClick={copyTemplate}>نسخ رؤوس الأعمدة</button>
          </div>
          <div className="table-scroll" style={{marginTop:8}}>
            <table className="template-table">
              <thead><tr>{templateHeaders.slice(0,9).map(h => <th key={h}>{h}</th>)}<th>...</th></tr></thead>
              <tbody><tr><td>أحمد الغامدي</td><td>رياضيات</td><td>22</td><td>0501234567</td><td>4</td><td></td><td>رياضيات - أ</td><td></td><td>رياضيات - ب</td><td>...</td></tr></tbody>
            </table>
          </div>
          <p className="card-sub" style={{marginTop:8}}>اترك الخلية فارغة لتعني «حصة فراغ»، أو اكتب اسم المادة/الفصل لتعني «مشغولة».</p>
        </div>
      </div>

      <PdfImportPanel onMergeTeachers={onMergeTeachers} />
      <WordImportPanel teachers={teachers} onApplyTimetable={onApplyTimetable} onMergeTeachers={onMergeTeachers} />

      <div className="card">
        <h3 className="card-title">تحديث أرقام الجوال بالجملة</h3>
        <p className="card-sub">ملف يحتوي على عمودي «الاسم» و«رقم_الجوال» فقط — يُطابَق كل صف مع معلم بنفس الاسم بالضبط ويُحدَّث رقمه، دون التأثير على بقية بياناته. يمكن أيضاً تعديل الأرقام يدوياً من تبويب «جدول المعلمين».</p>
        <button className="btn btn-secondary" onClick={() => phoneFileInputRef.current && phoneFileInputRef.current.click()}>اختيار ملف أرقام الجوال</button>
        <input ref={phoneFileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e => handlePhoneFile(e.target.files[0])} />
        {phoneMsg && (
          <p style={{marginTop:10, color: phoneMsg.type==='error' ? 'var(--danger)' : 'var(--accent)', fontWeight:600, fontSize:13.5}}>{phoneMsg.text}</p>
        )}
      </div>

      <div className="card">
        <h3 className="card-title">تحديث أرقام الجوال بالترتيب (نموذج جاهز مستقل)</h3>
        <p className="card-sub">
          بديل أكثر أماناً من المطابقة بالاسم أعلاه: نموذج جاهز بنفس ترتيب {labels.teachersOf} الحالي في البرنامج
          تماماً (عمود «م» هو مرجع المطابقة الفعلي، لا الاسم) — عبّئ عمود «رقم_الجوال» فقط في Excel، ثم ارفعه.
          لا يتغيّر أي شيء آخر في أي جدول أو بيانات أخرى، والصفوف التي تُترك فارغة تبقى بأرقامها الحالية دون أي تغيير.
        </p>
        <div style={{display:'flex', gap:10, flexWrap:'wrap', marginBottom:10}}>
          <button className="btn btn-secondary" onClick={downloadPhoneOrderTemplate} disabled={teachers.length===0}>تحميل نموذج أرقام الجوال</button>
          <button className="btn btn-secondary" onClick={() => phoneOrderFileInputRef.current && phoneOrderFileInputRef.current.click()} disabled={teachers.length===0}>رفع النموذج المعبّأ</button>
          <input ref={phoneOrderFileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e => handlePhoneOrderFile(e.target.files[0])} />
        </div>
        {phoneOrderTemplateText && (
          <textarea className="json-box" readOnly value={phoneOrderTemplateText} style={{minHeight:110}} onFocus={e => e.target.select()} />
        )}
        {phoneOrderMsg && (
          <p style={{marginTop:10, color: phoneOrderMsg.type==='error' ? 'var(--danger)' : 'var(--accent)', fontWeight:600, fontSize:13.5}}>{phoneOrderMsg.text}</p>
        )}
      </div>

      <div className="card">
        <h3 className="card-title">بيانات تجريبية</h3>
        <p className="card-sub">حمّل مجموعة بيانات وهمية لتجربة النظام فوراً دون ملف خارجي — يستبدل أي بيانات حقيقية محفوظة حالياً في مجلد Drive المتصل بجميع الأجهزة.</p>
        {!confirmMock ? (
          <button className="btn btn-secondary" onClick={() => setConfirmMock(true)}>تحميل بيانات تجريبية</button>
        ) : (
          <div className="confirm-row">
            <span>{'سيستبدل هذا بيانات ' + labels.teachersOf + ' الحالية في مجلد Drive المتصل ببيانات وهمية. متأكد؟'}</span>
            <button className="btn btn-secondary btn-sm" onClick={() => { onLoadMock(); setConfirmMock(false); }}>تأكيد التحميل</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setConfirmMock(false)}>إلغاء</button>
          </div>
        )}
      </div>

      <div className="card">
        <h3 className="card-title">إعادة الضبط</h3>
        <p className="card-sub">حذف جميع البيانات من مجلد Drive المتصل حالياً والبدء من جديد — يؤثر فوراً على جميع الأجهزة المتصلة بنفس المجلد.</p>
        {!confirmReset ? (
          <button className="btn btn-danger" onClick={() => setConfirmReset(true)}>مسح جميع البيانات</button>
        ) : (
          <div className="confirm-row">
            <span>هل أنت متأكد؟ سيُحذف كل شيء من مجلد Drive السحابي نفسه، ولن يمكن التراجع إلا من نسخة احتياطية JSON محفوظة مسبقاً.</span>
            <button className="btn btn-danger btn-sm" onClick={() => { onReset(); setConfirmReset(false); }}>تأكيد المسح</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setConfirmReset(false)}>إلغاء</button>
          </div>
        )}
      </div>
    </div>
  );
}

function LogoUploadField({ label, hint, value, onChange, inputId }){
  const inputRef = useRef(null);
  return (
    <div className="field">
      <label className="field-label" htmlFor={inputId}>{label}</label>
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        {value && <img src={value} alt={label} style={{width:48, height:48, objectFit:'contain', border:'1px solid var(--border)', borderRadius:8, background:'var(--surface)'}} />}
        <input
          ref={inputRef}
          id={inputId}
          type="file"
          accept="image/png,image/jpeg"
          className="input"
          style={{maxWidth:220}}
          onChange={e => {
            const file = e.target.files && e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = () => onChange(reader.result);
            reader.readAsDataURL(file);
          }}
        />
        {value && (
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => { onChange(''); if(inputRef.current) inputRef.current.value = ''; }}>إزالة</button>
        )}
      </div>
      {hint && <p className="card-sub" style={{margin:'6px 0 0'}}>{hint}</p>}
    </div>
  );
}

        <LogoUploadField

      <div style={{background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:12, padding:12, marginTop:6}}>
        <p className="field-label" style={{margin:'0 0 6px'}}>الاتصال بمجلد Google Drive</p>
        <p className="card-sub" style={{margin:'0 0 10px'}}>
          {'هذا النظام سحابي بالكامل منذ الإصدار v15: لا تُخزَّن أي بيانات في هذا المتصفح، وكل تعديل (جدول ' + draftLabels.teachersOf + '، سجل التكليفات، هذه الإعدادات نفسها) يُدفَع فوراً إلى مجلد Drive المتصل أدناه، ويُجلب تلقائياً عند كل فتح لهذا الرابط.'}
        </p>

// شاشة الاتصال الإلزامية بمجلد Google Drive (v15): لا تُخزَّن أي بيانات في هذا المتصفح بعد الآن؛
// كل بيانات النظام تُقرأ وتُكتب مباشرة من/إلى مجلد Drive الذي يحدده المستخدم هنا عبر خادم Apps
// Script. يُحفَظ رابط الاتصال نفسه فقط (لا البيانات) داخل Hash رابط الصفحة (#drive=...)، فحفظ هذا
// الرابط الكامل كإشارة مرجعية (Bookmark) يكفي لإعادة الدخول مباشرة لاحقاً دون تكرار هذه الخطوة.
// يُستخدَم هذا المكوّن نفسه في حالتين: الإعداد الأول (initialUrl غير موجود)، وإعادة محاولة الاتصال
// بعد فشل رابط محفوظ مسبقاً في Hash الرابط (initialUrl/initialError موجودان).
function DriveConnectGate({ onReady, initialUrl, initialError }){
  const [url, setUrl] = useState(initialUrl || '');
  const [status, setStatus] = useState(initialError ? 'error' : 'idle'); // idle | checking | error
  const [errorMsg, setErrorMsg] = useState(
    initialError ? 'تعذّر الاتصال بالرابط المحفوظ سابقاً في هذه الصفحة. تحقق من الرابط أو من اتصال الإنترنت، أو أدخل رابطاً آخر.' : ''
  );
  const [legacy, setLegacy] = useState(null);
  const [migrate, setMigrate] = useState(true);

  useEffect(() => {
    if(initialUrl) return; // لا داعٍ لعرض ترحيل بيانات قديمة عند إعادة محاولة اتصال فاشل، فقط عند الإعداد الأول
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        if(saved && Array.isArray(saved.teachers) && saved.teachers.length > 0){
          setLegacy(saved);
        }
      }
    }catch(err){ /* تجاهل أي بيانات محلية قديمة تالفة — لا تمنع الإعداد الجديد */ }
  }, [initialUrl]);

  const handleConnect = async () => {
    const trimmed = (url || '').trim();
    if(!trimmed){ setErrorMsg('أدخل رابط تطبيق الويب (/exec) أولاً.'); setStatus('error'); return; }
    setStatus('checking');
    setErrorMsg('');
    const result = await pullFromCloud(trimmed);
    if(!result.ok){
      setStatus('error');
      setErrorMsg('تعذّر الاتصال بهذا الرابط. تحقّق من: نشر التطبيق كـ"تطبيق ويب" (Web app) بصلاحية "أي شخص (Anyone)"، صحة نسخ رابط /exec كاملاً، ووجود اتصال إنترنت فعّال.');
      return;
    }
    const data = result.data || {};
    const cloudHasData = Array.isArray(data.teachers) && data.teachers.length > 0;
    if(!cloudHasData && legacy && migrate){
      onReady(trimmed, {
        teachers: legacy.teachers,
        assignments: Array.isArray(legacy.assignments) ? legacy.assignments : [],
        schoolSettings: legacy.schoolSettings || (legacy.schoolInfo ? { schoolName: legacy.schoolInfo.school || '', region: legacy.schoolInfo.region || '' } : {})
      }, true);
    } else {
      onReady(trimmed, data, false);
    }
  };

  return (
    <div className="shell" style={{maxWidth:760, margin:'36px auto', padding:'0 16px'}}>
      <div className="card" style={{borderWidth:2, borderColor:'var(--accent)'}}>
        <h3 className="card-title">نُواب — الاتصال بمجلد Google Drive</h3>
        <p className="card-sub">
          أصبح النظام سحابياً بالكامل: لا تُخزَّن أي بيانات في هذا المتصفح إطلاقاً. كل بيانات جدول
          المعلمين والمعلمات وسجل التكليفات وإعدادات المدرسة تُقرأ وتُكتب مباشرة من وإلى مجلد Google
          Drive الذي تحدده أدناه عبر رابط تطبيق ويب (Apps Script) بسيط ومجاني بالكامل.
        </p>

        <div className="field" style={{marginTop:10}}>
          <label className="field-label" htmlFor="gate-drive-url">رابط تطبيق الويب (Google Web App URL)</label>
          <input
            id="gate-drive-url"
            className="input"
            dir="ltr"
            style={{textAlign:'left'}}
            value={url}
            onChange={e => setUrl(e.target.value)}
            placeholder="https://script.google.com/macros/s/…/exec"
          />
        </div>

        {legacy && (
          <label style={{display:'flex', alignItems:'flex-start', gap:8, fontSize:13.5, fontWeight:600, margin:'10px 0'}}>
            <input type="checkbox" checked={migrate} onChange={e => setMigrate(e.target.checked)} style={{marginTop:3}} />
            <span>
              {'رُصدت بيانات محفوظة محلياً في هذا المتصفح من نسخة سابقة (' + legacy.teachers.length + ' معلم/ة) — نقلها تلقائياً إلى مجلد Drive الآن إذا كان المجلد فارغاً (لن يحدث أي استبدال إن كان المجلد يحوي بيانات فعلية مسبقاً).'}
            </span>
          </label>
        )}

        <button type="button" className="btn btn-primary" disabled={status==='checking'} onClick={handleConnect} style={{marginTop:6}}>
          {status==='checking' ? 'جارٍ الاتصال…' : 'اتصال والبدء'}
        </button>

        {status==='error' && errorMsg && (
          <p style={{marginTop:10, color:'var(--danger)', fontWeight:700, fontSize:13.5}}>{errorMsg}</p>
        )}

        <p className="card-sub" style={{marginTop:14, fontWeight:700}}>
          بعد الاتصال بنجاح: احفظ رابط هذه الصفحة بالكامل (بما فيه ما يلي علامة #) كإشارة مرجعية
          (Bookmark) في متصفحك — هذا هو مفتاح الدخول المباشر لاحقاً دون إعادة هذه الخطوة كل مرة.
        </p>

        <details style={{marginTop:14}} open={!initialUrl}>
          <summary style={{cursor:'pointer', fontSize:12.5, fontWeight:700, color:'var(--muted)'}}>ليس لديك رابط؟ إليك خطوات الإعداد (مرة واحدة فقط، 5 دقائق)</summary>
          <ol style={{fontSize:13, lineHeight:1.9, paddingRight:18, marginTop:8}}>
            <li>افتح <a href="https://script.google.com" target="_blank" rel="noopener noreferrer">script.google.com</a> ← مشروع جديد.</li>
            <li>الصق الكود أدناه بالكامل بدل محتوى Code.gs الافتراضي.</li>
            <li>عدّل قيمة <code>FOLDER_ID</code> في أول الكود إلى معرّف مجلد Google Drive الذي تريد التخزين فيه (الجزء الأخير من رابط المجلد بعد <code>folders/</code>).</li>
            <li>نشر ← نشر كتطبيق ويب (Deploy ← New deployment ← Web app): التنفيذ باسم «أنا (Me)»، ومن له صلاحية الوصول: «أي شخص (Anyone)». أول مرة فقط ستطلب Google تفويض الصلاحية لحساب Drive الخاص بك — طبيعي ومتوقع.</li>
            <li>انسخ رابط <code>/exec</code> الناتج، والصقه في الحقل أعلاه، ثم اضغط «اتصال والبدء».</li>
          </ol>
          <pre style={{fontSize:11, direction:'ltr', textAlign:'left', overflowX:'auto', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:8, padding:10, marginTop:6}}>{CLOUD_SYNC_SCRIPT_SAMPLE}</pre>
        </details>
      </div>
    </div>
  );
}

function App(){
  const [driveUrl, setDriveUrlState] = useState('');
  const [connectPhase, setConnectPhase] = useState('checking'); // checking | gate | loading | error | ready
  const [connectError, setConnectError] = useState('');
  const [teachers, setTeachers] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [schoolSettings, setSchoolSettings] = useState(DEFAULT_SCHOOL_SETTINGS);
  const [isSample, setIsSample] = useState(false);
  const [tab, setTab] = useState('dashboard');
  const [toast, setToast] = useState('');
  const [cloudStatus, setCloudStatus] = useState('idle'); // idle | syncing | success | error
  const [cloudLastSync, setCloudLastSync] = useState(null);
  const loadedRef = useRef(false);
  const stateRef = useRef({ teachers, assignments, schoolSettings });
  useEffect(() => { stateRef.current = { teachers, assignments, schoolSettings }; });

  // الاتصال الإلزامي بمجلد Drive (v15): لا تخزين محلي للبيانات إطلاقاً. عند فتح التطبيق يُقرأ رابط
  // الاتصال فقط من Hash الرابط (#drive=...)؛ إن وُجد تُجلب البيانات فوراً من المجلد السحابي، وإلا
  // تُعرض شاشة الاتصال الإلزامية (DriveConnectGate) بدل التطبيق بالكامل حتى يتصل المستخدم بنجاح.
  useEffect(() => {
    const existing = getDriveUrlFromHash();
    if(!existing){ setConnectPhase('gate'); return; }
    setDriveUrlState(existing);
    setConnectPhase('loading');
    pullFromCloud(existing).then(result => {
      if(!result.ok){
        setConnectError(result.error || 'network-error');
        setConnectPhase('error');
        return;
      }
      const data = result.data || {};
      setTeachers(Array.isArray(data.teachers) ? data.teachers : []);
      setAssignments(Array.isArray(data.assignments) ? data.assignments : []);
      setSchoolSettings(prev => ({ ...DEFAULT_SCHOOL_SETTINGS, ...(data.schoolSettings || {}) }));
      loadedRef.current = true;
      setCloudStatus('success');
      setCloudLastSync(new Date().toISOString());
      setConnectPhase('ready');
    });
  }, []);

  // يُستدعى من شاشة الاتصال (إعداد أول مرة، أو ترحيل بيانات محلية قديمة) بعد نجاح الاتصال فعلياً.
  const handleGateReady = useCallback((url, data, isMigration) => {
    const normalizedSettings = { ...DEFAULT_SCHOOL_SETTINGS, ...(data.schoolSettings || {}) };
    setTeachers(Array.isArray(data.teachers) ? data.teachers : []);
    setAssignments(Array.isArray(data.assignments) ? data.assignments : []);
    setSchoolSettings(normalizedSettings);
    setIsSample(false);
    setDriveUrlInHash(url);
    setDriveUrlState(url);
    loadedRef.current = true;
    setConnectPhase('ready');
    if(isMigration){
      setCloudStatus('syncing');
      pushToCloud(url, buildCloudPayload(data.teachers || [], data.assignments || [], normalizedSettings)).then(result => {
        setCloudStatus(result.ok ? 'success' : 'error');
        if(result.ok) setCloudLastSync(new Date().toISOString());
      });
    } else {
      setCloudStatus('success');
      setCloudLastSync(new Date().toISOString());
    }
  }, []);

  // الحفظ التلقائي السحابي: كل تغيير في البيانات (أياً كان مصدره) يُدفَع فوراً إلى مجلد Drive المتصل
  // — لا يوجد أي تخزين محلي احتياطي بعد الآن. عند فشل الدفع تُعاد المحاولة تلقائياً عدة مرات مع تأخير
  // متزايد، وتبقى حالة «فشل الحفظ» ظاهرة بوضوح في شارة الترويسة وفي تبويب الإعدادات حتى ينجح الاتصال.
  useEffect(() => {
    if(!loadedRef.current || !driveUrl || connectPhase !== 'ready') return;
    const payload = buildCloudPayload(teachers, assignments, schoolSettings);
    let cancelled = false;
    const tryPush = (retriesLeft) => {
      pushToCloud(driveUrl, payload).then(result => {
        if(cancelled) return;
        if(result.ok){
          setCloudStatus('success');
          setCloudLastSync(new Date().toISOString());
        } else if(retriesLeft > 0){
          setTimeout(() => tryPush(retriesLeft - 1), 3000);
        } else {
          setCloudStatus('error');
        }
      });
    };
    setCloudStatus('syncing');
    const t = setTimeout(() => tryPush(4), 350);
    return () => { cancelled = true; clearTimeout(t); };
  }, [teachers, assignments, schoolSettings, driveUrl, connectPhase]);

  useEffect(() => {
    if(!toast) return;
    const t = setTimeout(() => setToast(''), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  // فصل الاتصال بالمجلد الحالي (مثلاً للانتقال إلى مجلد Drive آخر): يمسح الرابط من Hash الصفحة
  // ويعيد تحميلها بالكامل، فتُعرض شاشة الاتصال الإلزامية من جديد.
  const disconnectDrive = useCallback(() => {
    clearDriveUrlFromHash();
    window.location.reload();
  }, []);

  // إعادة محاولة الحفظ السحابي يدوياً فوراً (زر «إعادة محاولة الحفظ الآن» في تبويب الإعدادات).
  const pushNow = useCallback(() => {
    if(!driveUrl) return;
    setCloudStatus('syncing');
    pushToCloud(driveUrl, buildCloudPayload(stateRef.current.teachers, stateRef.current.assignments, stateRef.current.schoolSettings)).then(result => {
      setCloudStatus(result.ok ? 'success' : 'error');
      if(result.ok){ setCloudLastSync(new Date().toISOString()); setToast('تمت إعادة الحفظ السحابي بنجاح'); }
      else { setToast('تعذّر الحفظ السحابي — سيُعاد المحاولة تلقائياً'); }
    });
  }, [driveUrl]);

  // إعدادات المدرسة: الحفظ السحابي التلقائي (الأثر أعلاه) يتولى الدفع فور أي تغيير في schoolSettings.
  const handleUpdateSettings = useCallback((newSettings) => {
    setSchoolSettings(newSettings);
  }, []);

  const handleAssign = useCallback((payload) => {
    const { teacherId, date, day, period, className, subject, absentTeacherName } = payload;
    const newTeachers = teachers.map(t => t.id === teacherId ? { ...t, substituteCount: t.substituteCount + 1 } : t);
    const teacher = teachers.find(t => t.id === teacherId);
    const newAssignments = [...assignments, {
      id: uid('a'), teacherId, teacherName: teacher ? teacher.name : '',
      date, day, period, className: className || '', subject: subject || '', absentTeacherName: absentTeacherName || '',
      notes:'', ts: Date.now()
    }];
    setTeachers(newTeachers);
    setAssignments(newAssignments);
    setToast('تم تسجيل ' + (teacher ? teacher.name : '') + ' لحصة الانتظار');
  }, [teachers, assignments]);

  const handleRemoveAssignment = useCallback((assignmentId) => {
    setAssignments(prev => {
      const a = prev.find(x => x.id === assignmentId);
      if(a){
        setTeachers(ts => ts.map(t => t.id === a.teacherId ? { ...t, substituteCount: Math.max(0, t.substituteCount - 1) } : t));
      }
      return prev.filter(x => x.id !== assignmentId);
    });
    setToast('تم حذف التكليف والتراجع عن الاحتساب');
  }, []);

  const handleUpdateNote = useCallback((assignmentId, notes) => {
    setAssignments(prev => prev.map(a => a.id === assignmentId ? { ...a, notes } : a));
  }, []);

  const handleUpdatePhone = useCallback((teacherId, phone) => {
    setTeachers(prev => prev.map(t => t.id === teacherId ? { ...t, phone } : t));
  }, []);

  // محرر الجدول التفاعلي: يحدّث حصة واحدة (يوم+رقم حصة) لمعلم/ة واحد، ثم يعيد احتساب نصابه الأسبوعي
  // بالكامل من الجدول الجديد. بما أن isFullQuota وeligibleForSlot وcomputeDayAvailability جميعها تُشتق
  // مباشرة من teacher.nisab وteacher.schedule في كل عرض، فإن أي تغيير هنا ينعكس فوراً وتلقائياً على حالة
  // الاستبعاد بسبب النصاب الكامل، وعلى محرك ترشيح البدلاء، ومؤشر فراغات اليوم — دون أي منطق إضافي.
  const handleUpdateSchedule = useCallback((teacherId, day, period, cellPatch) => {
    const target = teachers.find(t => t.id === teacherId);
    if(!target) return;
    const newDaySchedule = { ...target.schedule[day], [period]: cellPatch };
    const newSchedule = { ...target.schedule, [day]: newDaySchedule };
    const nisab = DAYS.reduce((sum, d) => sum + PERIODS.filter(p => newSchedule[d][p].busy).length, 0);
    const wasFull = isFullQuota(target.nisab);
    const isFull = isFullQuota(nisab);
    let toastMsg = 'تم تحديث جدول ' + target.name + ' — النصاب الجديد: ' + nisab;
    if(!wasFull && isFull) toastMsg += ' (أصبح مستثنى تلقائياً لاكتمال النصاب)';
    else if(wasFull && !isFull) toastMsg += ' (عاد مؤهلاً لحصص الانتظار)';
    const newTeachers = teachers.map(t => t.id === teacherId ? { ...t, schedule: newSchedule, nisab } : t);
    setTeachers(newTeachers);
    setToast(toastMsg);
  }, [teachers]);

  // الاستبعاد الإداري: يعزل المعلم/ة كلياً ومطلقاً عن قائمة المفاضلة والترشيح (eligibleForSlot)
  // دون حذف سجله أو التأثير على جدوله أو رصيده التراكمي — قابل للتراجع في أي وقت.
  const handleUpdateExclusion = useCallback((teacherId, patch) => {
    setTeachers(prev => prev.map(t => t.id === teacherId ? { ...t, ...patch } : t));
  }, []);

  const handleImportPhones = useCallback((updates) => {
    const nameToPhone = new Map(updates.filter(u => u.phone).map(u => [u.name, u.phone]));
    const matched = teachers.filter(t => nameToPhone.has(t.name.trim()));
    const matchedNames = new Set(matched.map(t => t.name.trim()));
    const unmatched = updates.map(u => u.name).filter(n => !matchedNames.has(n));
    const newTeachers = teachers.map(t => nameToPhone.has(t.name.trim()) ? { ...t, phone: nameToPhone.get(t.name.trim()) } : t);
    setTeachers(newTeachers);
    return { matched: matched.length, unmatched };
  }, [teachers]);

  // مسار مستقل تماماً لتحديث أرقام الجوال بالترتيب (نموذج جاهز): يُحدِّث فقط هاتف المعلم الموجود
  // في نفس موضع الصف ضمن قائمة teachers الحالية — لا يلمس الاسم أو النصاب أو الجدول أو أي بيانات
  // أخرى إطلاقاً، ولا علاقة له بمسار المطابقة بالاسم أعلاه.
  const handleImportPhonesByOrder = useCallback((updates) => {
    const byIndex = new Map(updates.map(u => [u.index, u.phone]));
    const newTeachers = teachers.map((t, i) => byIndex.has(i) ? { ...t, phone: byIndex.get(i) } : t);
    setTeachers(newTeachers);
    setToast('تم تحديث ' + byIndex.size + ' رقم جوال حسب ترتيب الجدول');
    return { updated: byIndex.size };
  }, [teachers]);

  const handleLoadMock = useCallback(() => {
    setTeachers(generateMockTeachers());
    setAssignments([]);
    setIsSample(true);
    setToast('تم تحميل بيانات تجريبية');
  }, []);

  const handleReset = useCallback(() => {
    setTeachers([]);
    setAssignments([]);
    setIsSample(false);
    setToast('تم مسح جميع البيانات');
  }, []);

  const handleImportTeachers = useCallback((parsed) => {
    setTeachers(parsed);
    setAssignments([]);
    setIsSample(false);
  }, []);

  const handleMergeTeachers = useCallback((newTeachers, mode) => {
    if(mode === 'replace'){
      setTeachers(newTeachers);
      setAssignments([]);
    } else {
      setTeachers(prev => [...prev, ...newTeachers]);
    }
    setIsSample(false);
    setToast('تم حفظ ' + newTeachers.length + ' معلم في النظام');
  }, []);

  // آلية الاستيراد الذكية على أي جهاز جديد (Safe Restore Engine): تُتحقَّق البنية أولاً
  // (validateBackupShape) قبل أي كتابة فعلية — أي رفض هنا يوقف الاسترجاع بالكامل دون المساس بالحالة
  // الحالية إطلاقاً. عند النجاح تُفرَّغ حالة المعلمين/التكليفات القديمة وتُستبدل دفعة واحدة بالبيانات
  // الجديدة (كل معلم يُعاد بناؤه بأمان عبر normalizeRestoredTeacher لإكمال أي حقل ناقص)، فتُعاد
  // كتابتها تلقائياً وفوراً في LocalStorage عبر أثر الحفظ التلقائي الموجود أصلاً فور هذا التحديث،
  // وتُعاد رسمة الواجهة بالكامل لحظياً (React) دون أي حاجة لإعادة تحميل الصفحة يدوياً. يعيد الدالة
  // عدد المعلمين والتكليفات المستعادة كي تعرضهما الواجهة المستدعية (DataTab) في إشعار Toast عائم.
  const handleImportBackup = useCallback((parsed) => {
    validateBackupShape(parsed);
    const restoredTeachers = parsed.teachers.map(normalizeRestoredTeacher);
    const restoredAssignments = Array.isArray(parsed.assignments) ? parsed.assignments : [];
    let restoredSettings = null;
    if(parsed.schoolSettings){
      restoredSettings = { ...DEFAULT_SCHOOL_SETTINGS, ...parsed.schoolSettings };
    } else if(parsed.schoolInfo){
      restoredSettings = { ...DEFAULT_SCHOOL_SETTINGS, schoolName: parsed.schoolInfo.school || '', region: parsed.schoolInfo.region || '' };
    }
    setTeachers(restoredTeachers);
    setAssignments(restoredAssignments);
    if(restoredSettings) setSchoolSettings(restoredSettings);
    setIsSample(false);
    return { teachersCount: restoredTeachers.length, assignmentsCount: restoredAssignments.length };
  }, []);

  // المسار الأول: تحديث/إضافة سجلات المعلمين (الاسم + النصاب + رقم الجوال) القادمة من ملف aSc XML.
  // المطابقة تتم بالاسم الحرفي الكامل: إن وُجد معلم بنفس الاسم يُحدَّث نصابه وجواله فقط مع الحفاظ
  // على معرّفه وجدوله ورصيد الانتظار المتراكم لديه؛ وإلا يُنشأ له سجل جديد بجدول فراغ فارغ إلى حين
  // استيراد الجدول العام (المسار الثاني).
  const handleUpsertTeacherProfiles = useCallback((profiles) => {
    const next = [...teachers];
    profiles.forEach(p => {
      const displayName = p.name.trim();
      const matchKey = normalizeTeacherName(p.name);
      const idx = next.findIndex(t => normalizeTeacherName(t.name) === matchKey);
      if(idx >= 0){
        next[idx] = {
          ...next[idx],
          nisab: p.nisab,
          subject: p.subject && p.subject !== '—' ? p.subject : next[idx].subject,
          phone: p.phone ? p.phone : next[idx].phone
        };
      } else {
        next.push({
          id: uid('t'), name: displayName, subject: p.subject || '—', nisab: p.nisab,
          phone: p.phone || '', substituteCount: 0, excluded:false, exclusionReason:'', schedule: emptySchedule()
        });
      }
    });
    setTeachers(next);
    setIsSample(false);
    setToast('تم حفظ بيانات ' + profiles.length + ' معلم (تحديث أو إضافة)');
  }, [teachers]);

  // المسار الثاني: تطبيق جدول الفراغ/الإشغال العام على المعلمين المطابقين بالاسم من المسار الأول.
  // يستبدل جدول كل معلم مطابق بالكامل (إعادة احتساب فوري لحصص فراغه)، ويمكن اختيارياً إنشاء سجل
  // جديد لأي اسم غير موجود مسبقاً في القائمة.
  const handleApplyTimetable = useCallback((rows, options) => {
    const createMissing = !!(options && options.createMissing);
    const next = [...teachers];
    const byName = new Map(next.map((t,i) => [normalizeTeacherName(t.name), i]));
    rows.forEach(r => {
      const displayName = r.name.trim();
      const matchKey = normalizeTeacherName(r.name);
      if(byName.has(matchKey)){
        const i = byName.get(matchKey);
        next[i] = { ...next[i], schedule: r.schedule };
      } else if(createMissing){
        next.push({
          id: uid('t'), name: displayName, subject: '—', nisab: r.busyCount,
          phone: '', substituteCount: 0, excluded:false, exclusionReason:'', schedule: r.schedule
        });
      }
    });
    setTeachers(next);
    setIsSample(false);
    setToast('تم تحديث جداول الفراغ والإشغال من الملف العام');
  }, [teachers]);

  const stats = useMemo(() => computeStats(teachers), [teachers]);
  const labels = useMemo(() => buildLabels(schoolSettings.gender), [schoolSettings.gender]);
  const agentTitle = useMemo(() => getAgentTitle(schoolSettings.agentTitleKey, schoolSettings.gender), [schoolSettings.agentTitleKey, schoolSettings.gender]);
  const schoolCtxValue = useMemo(() => ({
    settings: schoolSettings,
    labels,
    agentTitle,
    updateSettings: handleUpdateSettings,
    notify: setToast,
    driveUrl,
    cloudSync: { status: cloudStatus, lastSync: cloudLastSync },
    cloudSyncNow: pushNow,
    disconnectDrive
  }), [schoolSettings, labels, agentTitle, handleUpdateSettings, driveUrl, cloudStatus, cloudLastSync, pushNow, disconnectDrive]);

  const tabs = [
    { id:'dashboard', label:'لوحة التحكم' },
    { id:'teachers', label:'جدول ' + labels.teachersOf },
    { id:'finder', label:'تعيين حصص الانتظار' },
    { id:'assign', label:'التكليفات والطباعة' },
    { id:'reports', label:'التقارير التراكمية' },
    { id:'data', label:'استيراد البيانات' },
    { id:'settings', label:'إعدادات المدرسة' },
  ];

  if(connectPhase !== 'ready'){
    if(connectPhase === 'gate'){
      return <DriveConnectGate onReady={handleGateReady} />;
    }
    if(connectPhase === 'error'){
      return <DriveConnectGate onReady={handleGateReady} initialUrl={driveUrl} initialError={connectError} />;
    }
    return (
      <div className="shell" style={{maxWidth:480, margin:'80px auto', textAlign:'center', padding:'0 16px'}}>
        <div className="card">
          <h3 className="card-title">جارٍ الاتصال بمجلد Drive…</h3>
          <p className="card-sub">يُجلب أحدث نسخة من البيانات من المجلد السحابي المتصل.</p>
        </div>
      </div>
    );
  }

  return (
    <SchoolContext.Provider value={schoolCtxValue}>
      <div className="shell">
        <header className="app-header no-print">
          <div className="brand">
            <div className="brand-mark">نُ</div>
            <div>
              <h1 className="brand-title">نُواب</h1>
              <p className="brand-tag">{'إدارة جداول ' + labels.teachersOf + ' وتوزيع حصص الانتظار بعدالة'}</p>
            </div>
          </div>
          <div className="header-meta">
            {isSample && <span className="badge badge-sample">بيانات تجريبية</span>}
            <span className="badge badge-count tabular">{stats.total} {labels.teacher}</span>
            <span className="badge badge-accent tabular">{stats.totalSub} حصة انتظار منفذة</span>
            <span
              className="badge tabular"
              style={{
                background: cloudStatus==='error' ? 'var(--danger)' : (cloudStatus==='syncing' ? 'var(--warn)' : 'var(--accent)'),
                color:'#fff'
              }}
              title={cloudSyncStatusText(cloudStatus, cloudLastSync)}
            >
              {cloudStatus==='syncing' ? '⏳ جارٍ الحفظ على Drive' : (cloudStatus==='error' ? '⚠ فشل الحفظ — لا تُغلق الصفحة' : '☁ متصل بـ Drive')}
            </span>
          </div>
        </header>

        <nav className="tabbar no-print" role="tablist" aria-label="أقسام النظام">
          {tabs.map(tb => (
            <button key={tb.id} className="tab-btn" role="tab" aria-selected={tab===tb.id} onClick={() => setTab(tb.id)}>
              {tb.label}
            </button>
          ))}
        </nav>

        <main>
          {tab==='dashboard' && <DashboardTab teachers={teachers} isSample={isSample} />}
          {tab==='teachers' && <TeachersTab teachers={teachers} onUpdatePhone={handleUpdatePhone} onUpdateExclusion={handleUpdateExclusion} onUpdateSchedule={handleUpdateSchedule} />}
          {tab==='finder' && (
            <FinderTab teachers={teachers} assignments={assignments} onAssign={handleAssign} onRemoveAssignment={handleRemoveAssignment} onGoToPrint={() => setTab('assign')} />
          )}
          {tab==='assign' && (
            <AssignmentsPrintTab
              teachers={teachers}
              assignments={assignments}
              onUpdateNote={handleUpdateNote}
              onRemoveAssignment={handleRemoveAssignment}
            />
          )}
          {tab==='reports' && <ReportsTab teachers={teachers} assignments={assignments} />}
          {tab==='data' && (
            <DataTab
              teachers={teachers}
              assignments={assignments}
              lastSavedAt={cloudLastSync}
              onLoadMock={handleLoadMock}
              onReset={handleReset}
              onImportTeachers={handleImportTeachers}
              onImportBackup={handleImportBackup}
              onImportPhones={handleImportPhones}
              onImportPhonesByOrder={handleImportPhonesByOrder}
              onMergeTeachers={handleMergeTeachers}
              onUpsertProfiles={handleUpsertTeacherProfiles}
              onApplyTimetable={handleApplyTimetable}
            />
          )}
          {tab==='settings' && <SchoolSettingsTab />}
        </main>

        <Toast message={toast} />
      </div>
    </SchoolContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body></html>
