<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>نُواب</title>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --surface-2:#EFEAE0;
    --border:#E1DACB;
    --ink:#20302C;
    --muted:#69756D;
    --accent:#0B6E67;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1F1EE;
    --warn:#B8791E;
    --warn-soft:#F8ECD8;
    --danger:#AF3B36;
    --danger-soft:#F6E2DF;
    --busy:#C7C0B1;
    --shadow: 0 1px 2px rgba(32,48,44,0.06), 0 8px 24px rgba(32,48,44,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1E1B;
      --surface:#152B26;
      --surface-2:#1B3630;
      --border:#2A4941;
      --ink:#E9F3EF;
      --muted:#9BB0A8;
      --accent:#3FCBB9;
      --accent-ink:#08211D;
      --accent-soft:#1B3F39;
      --warn:#E3A855;
      --warn-soft:#3C2E17;
      --danger:#E4837B;
      --danger-soft:#3F211F;
      --busy:#3A4E48;
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 12px 28px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1E1B;
    --surface:#152B26;
    --surface-2:#1B3630;
    --border:#2A4941;
    --ink:#E9F3EF;
    --muted:#9BB0A8;
    --accent:#3FCBB9;
    --accent-ink:#08211D;
    --accent-soft:#1B3F39;
    --warn:#E3A855;
    --warn-soft:#3C2E17;
    --danger:#E4837B;
    --danger-soft:#3F211F;
    --busy:#3A4E48;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 12px 28px rgba(0,0,0,0.3);
  }

  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{
    margin:0;
    direction:rtl;
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
    font-size:15px;
    line-height:1.6;
    padding-inline:20px;
    padding-block:24px;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Almarai','Tajawal',sans-serif;
    text-wrap:balance;
  }
  .tabular{ font-variant-numeric: tabular-nums; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .shell{ max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }

  /* header */
  .app-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Almarai',sans-serif; font-weight:800; font-size:18px;
    flex:none;
  }
  .brand-title{ font-size:22px; font-weight:800; margin:0; }
  .brand-tag{ margin:0; color:var(--muted); font-size:13px; }
  .header-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
    font-size:12.5px; font-weight:700; border:1px solid transparent;
  }
  .badge-sample{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
  .badge-count{ background:var(--surface-2); color:var(--ink); border-color:var(--border); }
  .badge-danger{ background:var(--danger-soft); color:var(--danger); }
  .badge-accent{ background:var(--accent-soft); color:var(--accent); }
  .badge-warn{ background:var(--warn-soft); color:var(--warn); }

  /* tabs */
  .tabbar{ display:flex; gap:6px; padding:5px; background:var(--surface-2); border-radius:14px; width:fit-content; max-width:100%; overflow-x:auto; }
  .tab-btn{
    appearance:none; border:none; background:transparent; color:var(--muted); cursor:pointer;
    padding:9px 16px; border-radius:10px; font-size:14px; font-weight:700; white-space:nowrap;
  }
  .tab-btn[aria-selected="true"]{ background:var(--surface); color:var(--accent); box-shadow:var(--shadow); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .card-title{ font-size:15px; font-weight:800; margin:0 0 4px; }
  .card-sub{ margin:0 0 14px; color:var(--muted); font-size:13px; }

  /* dashboard stats */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; }
  .stat-label{ font-size:13px; color:var(--muted); font-weight:500; }
  .stat-value{ font-family:'Almarai',sans-serif; font-weight:800; font-size:30px; }
  .stat-value.accent{ color:var(--accent); }
  .stat-value.danger{ color:var(--danger); }

  .two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; align-items:start; }
  @media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }

  .bar-row{ display:grid; grid-template-columns:74px 1fr 34px; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label{ font-size:13px; color:var(--muted); font-weight:600; }
  .bar-track{ height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:999px; }
  .bar-value{ font-size:13px; font-weight:700; text-align:left; }

  .rank-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .rank-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-name{ font-weight:700; font-size:13.5px; }
  .rank-sub{ color:var(--muted); font-size:12px; }
  .rank-count{ font-weight:800; color:var(--accent); }

  /* controls */
  .field-label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .input, .select{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--ink);
    border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    border-radius:10px; padding:9px 16px; font-size:14px; font-weight:700; border:1px solid transparent;
    text-decoration:none;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }
  .btn-whatsapp{ background:#25D366; color:#08210F; }
  .btn-backup-export{ background:#178048; color:#FFFFFF; }
  .btn-backup-export:hover{ background:#136B3C; }
  .btn-backup-import{ background:#1D63D8; color:#FFFFFF; }
  .btn-backup-import:hover{ background:#1751B0; }
  .backup-card{ border:1.5px solid var(--accent); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:8px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .toolbar .field{ min-width:180px; flex:1; }

  /* teachers table */
  .table-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:14px; }
  table.matrix{ border-collapse:separate; border-spacing:0; width:100%; min-width:900px; font-size:13px; }
  table.matrix th, table.matrix td{ padding:7px 8px; text-align:center; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.matrix thead th{ background:var(--surface-2); font-family:'Almarai',sans-serif; font-weight:700; position:sticky; top:0; z-index:2; }
  table.matrix .col-day-start{ border-right:2px solid var(--border); }
  table.matrix td.name-cell, table.matrix th.name-head{
    position:sticky; right:0; background:var(--surface); text-align:right; font-weight:700; z-index:3;
    box-shadow:-6px 0 8px -8px rgba(0,0,0,0.25);
    min-width:150px;
  }
  table.matrix thead th.name-head{ background:var(--surface-2); z-index:4; }
  table.matrix tbody tr:nth-child(even) td.name-cell{ background:var(--surface); }
  table.matrix tbody tr:hover td{ background:var(--accent-soft); }
  table.matrix tbody tr:hover td.name-cell{ background:var(--accent-soft); }

  .dot{ width:13px; height:13px; border-radius:50%; margin:0 auto; }
  .dot-free{ background:var(--accent); }
  .dot-busy{ background:var(--busy); }

  .sched-cell{ display:inline-flex; align-items:center; justify-content:center; min-width:38px; max-width:78px; padding:3px 6px; border-radius:7px; font-size:11px; font-weight:800; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sched-cell.sched-free{ background:transparent; color:var(--muted); font-weight:600; }
  .sched-cell.sched-busy{ background:var(--accent-soft); color:var(--accent); }
  .sched-cell-editable{ cursor:pointer; transition:box-shadow .12s ease, transform .12s ease; }
  .sched-cell-editable:hover{ box-shadow:0 0 0 2px var(--accent) inset; }
  .sched-cell-editable:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted); margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; }

  .phone-input{ width:120px; background:var(--surface); border:1px solid var(--border); color:var(--ink); border-radius:8px; padding:5px 8px; font-size:12.5px; font-family:inherit; text-align:center; direction:ltr; }

  /* finder */
  .finder-result{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--surface); flex-wrap:wrap; }
  .finder-result:last-child{ margin-bottom:0; }
  .finder-name{ font-weight:800; }
  .finder-meta{ color:var(--muted); font-size:12.5px; }

  .assign-log-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; flex-wrap:wrap; }
  .assign-log-item:last-child{ border-bottom:none; }
  .assign-log-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  .day-schedule-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:8px; margin-top:12px; }
  .day-schedule-cell{ border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; background:var(--surface); }
  .day-schedule-cell.is-busy{ background:var(--accent-soft); border-color:var(--accent); }
  .day-schedule-cell.is-free{ opacity:0.6; }
  .day-schedule-period{ display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .day-schedule-value{ display:block; font-size:13.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; }

  .vacant-slot-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }

  /* import/data */
  .drop-zone{ border:1.5px dashed var(--border); border-radius:14px; padding:26px 16px; text-align:center; background:var(--surface-2); }
  .drop-zone p{ margin:4px 0; }
  .template-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .template-table th, .template-table td{ border:1px solid var(--border); padding:5px 7px; text-align:center; white-space:nowrap; }
  .template-table th{ background:var(--surface-2); font-weight:700; }
  textarea.json-box{ width:100%; min-height:160px; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:12px; resize:vertical; }

  .confirm-row{ display:flex; align-items:center; gap:8px; background:var(--danger-soft); border:1px solid var(--danger); border-radius:10px; padding:8px 12px; margin-top:8px; font-size:13px; flex-wrap:wrap; }

  .pdf-fail-item{ margin-bottom:10px; padding:10px 12px; background:var(--warn-soft); border-radius:10px; }
  .pdf-fail-item:last-child{ margin-bottom:0; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,20,18,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-panel{ background:var(--surface); border-radius:16px; padding:20px; max-width:920px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .cell-toggle{ background:none; border:none; padding:4px; cursor:pointer; border-radius:6px; }
  .cell-toggle:hover{ background:var(--accent-soft); }

  /* print sheet */
  .letterhead{ text-align:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--border); }
  .letterhead-logo-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; }
  .letterhead-logo-slot{ flex:0 0 70px; display:flex; align-items:center; justify-content:center; }
  .letterhead-logo{ max-width:70px; max-height:70px; object-fit:contain; }
  .letterhead-text{ flex:1; }
  .lh-line{ margin:2px 0; font-size:13.5px; }
  .lh-bold{ font-weight:800; font-family:'Almarai',sans-serif; }
  .lh-input{ border:none; border-bottom:1px dashed var(--border); background:transparent; color:var(--ink); font-family:inherit; font-size:inherit; text-align:center; padding:2px 6px; min-width:180px; }
  .lh-title{ margin:10px 0 4px; font-size:18px; font-weight:800; }
  .lh-date{ margin:0; color:var(--muted); font-size:13px; }

  table.print-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.print-table th, table.print-table td{ border:1px solid var(--border); padding:8px 6px; text-align:center; }
  table.print-table thead th{ background:var(--surface-2); font-family:'Almarai',sans-serif; font-weight:700; }
  .sign-cell{ min-width:70px; }
  .note-input{ width:100%; border:none; background:transparent; color:var(--ink); font-family:inherit; font-size:inherit; text-align:center; }

  .sign-footer{ display:flex; justify-content:space-around; gap:24px; margin-top:34px; flex-wrap:wrap; }
  .sign-block{ text-align:center; min-width:180px; }
  .sign-role{ font-weight:700; margin:0 0 26px; }
  .sign-line{ border-bottom:1px solid var(--ink); height:1px; margin-bottom:6px; }
  .sign-caption{ margin:0; font-size:11.5px; color:var(--muted); }

  /* toast */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow); z-index:50; max-width:90vw;
  }

  .empty-note{ color:var(--muted); font-size:13.5px; text-align:center; padding:20px; }

  .assign-group{ margin-bottom:22px; }
  .assign-group:last-of-type{ margin-bottom:0; }
  .assign-group-title{ font-weight:800; font-size:14px; margin:0 0 10px; line-height:1.9; }

  .report-block{ margin-bottom:26px; }
  .report-block:last-of-type{ margin-bottom:0; }
  .report-block-title{ font-weight:800; font-size:14.5px; margin:0 0 10px; }

  @media (max-width:600px){
    .app-header{ flex-direction:column; }
    .stat-value{ font-size:26px; }
  }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff !important; color:#000 !important; padding:0; }
    .shell{ max-width:none; gap:0; }
    .card.print-sheet{ box-shadow:none; border:none; border-radius:0; padding:0; }
    table.print-table th, table.print-table td{ border:1px solid #000 !important; color:#000 !important; }
    table.print-table thead th{ background:#eee !important; }
    .lh-input, .note-input{ border:none !important; color:#000 !important; }
    .sign-line{ border-bottom:1px solid #000 !important; }
    .lh-date, .sign-caption{ color:#333 !important; }
    .assign-group-title{ color:#000 !important; }
    .assign-group{ break-inside: avoid; }
    .letterhead-logo{ max-width:56px; max-height:56px; }
    .report-block{ break-inside: avoid; }
    @page{ size:A4; margin:14mm; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, useContext, createContext } = React;

const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const PERIODS = [1,2,3,4,5,6,7];
const FULL_NISAB = 24;
const STORAGE_KEY = 'nuwwab-waiting-periods-v2';
const SUBJECTS = ['لغة عربية','رياضيات','علوم','لغة إنجليزية','تربية إسلامية','دراسات اجتماعية','حاسب آلي','تربية بدنية','تربية فنية','فيزياء','كيمياء','أحياء','قرآن كريم'];
const WEEKDAY_MAP = { 0:'الأحد', 1:'الاثنين', 2:'الثلاثاء', 3:'الأربعاء', 4:'الخميس' };
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// إعدادات المدرسة: تُخزَّن محلياً وتتحكم في الترويسة الرسمية وإشعارات واتساب، كما يُشتق منها
// التوصيف اللغوي (معلم/معلمة، الأستاذ/الأستاذة، وكيل/وكيلة، مدير/مديرة) في كامل النظام اعتماداً
// على جنس المدرسة (بنين/بنات) — على اعتبار أن مدارس التعليم العام أحادية الجنس.
const DEFAULT_SCHOOL_SETTINGS = {
  schoolName:'', region:'', city:'', gender:'boys',
  agentName:'', agentTitleKey:'affairs', principalName:'', showPrincipalInPrint:true,
  ministryLogo:'', schoolLogo:''
};

function buildLabels(gender){
  const isGirls = gender === 'girls';
  return {
    isGirls,
    teacher: isGirls ? 'معلمة' : 'معلم',
    teacherDef: isGirls ? 'المعلمة' : 'المعلم',
    teachers: isGirls ? 'معلمات' : 'معلمون',
    teachersOf: isGirls ? 'المعلمات' : 'المعلمين',
    honorific: isGirls ? 'الأستاذة' : 'الأستاذ',
    honorable: isGirls ? 'المكرمة' : 'المكرم',
    respected: isGirls ? 'المحترمة' : 'المحترم',
    absentTeacher: isGirls ? 'المعلمة الغائبة' : 'المعلم الغائب',
    assignedTeacher: isGirls ? 'المعلمة المكلفة' : 'المعلم المكلف',
    assignedRole: isGirls ? 'المكلفة' : 'المكلف',
    agentRole: isGirls ? 'وكيلة الشؤون المدرسية' : 'وكيل الشؤون المدرسية',
    principalRole: isGirls ? 'مديرة المدرسة' : 'مدير المدرسة'
  };
}

// مسمى الوكيل/الوكيلة قابل للتخصيص عبر ثلاث صيغ متعارف عليها إدارياً، مع تذكير/تأنيث تلقائي حسب جنس المدرسة.
const AGENT_TITLE_OPTIONS = [
  { key:'school', boys:'وكيل المدرسة', girls:'وكيلة المدرسة' },
  { key:'affairs', boys:'وكيل الشؤون المدرسية', girls:'وكيلة الشؤون المدرسية' },
  { key:'educational', boys:'وكيل الشؤون التعليمية', girls:'وكيلة الشؤون التعليمية' }
];
function getAgentTitle(agentTitleKey, gender){
  const opt = AGENT_TITLE_OPTIONS.find(o => o.key === agentTitleKey) || AGENT_TITLE_OPTIONS[1];
  return gender === 'girls' ? opt.girls : opt.boys;
}

// ===== المزامنة السحابية (مجلد Google Drive عبر Google Apps Script Web App) =====
// يُبنى حِمل البيانات المُرسَل/المُستقبَل بنفس شكل النسخة الاحتياطية JSON المستخدمة أصلاً في تبويب
// «استيراد البيانات»، لضمان توافق كامل بين التصدير اليدوي والمزامنة السحابية التلقائية. يحفظ خادم
// Apps Script هذا الحِمل كثلاثة ملفات منفصلة منظَّمة (teachers.json, assignments.json, settings.json)
// داخل مجلد Drive المحدَّد بدل خلية واحدة في جدول بيانات — انظر CLOUD_SYNC_SCRIPT_SAMPLE أدناه.
function buildCloudPayload(teachers, assignments, schoolSettings){
  return { version: 2, teachers, assignments, schoolSettings, syncedAt: new Date().toISOString() };
}

// POST بصيغة text/plain عمداً (بدل application/json): تطبيقات الويب في Google Apps Script لا تُنفّذ
// دالة doOptions للرد على طلب OPTIONS التمهيدي (Preflight) الذي يفرضه المتصفح تلقائياً مع
// application/json، فيفشل الطلب بصمت بسبب CORS رغم صحة الرابط تماماً؛ text/plain طلب "بسيط" لا
// يستدعي Preflight إطلاقاً، وهي الصيغة المعتمدة عملياً للتوافق مع Apps Script.
async function pushToCloud(url, payload){
  if(!url) return { ok:false, error:'no-url' };
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) return { ok:false, error:'http-' + res.status };
    return { ok:true };
  }catch(err){
    // انقطاع إنترنت، رابط غير صالح، أو حظر من طرف الخادم — التطبيق يستمر محلياً دون أي توقف.
    return { ok:false, error: (err && err.message) || 'network-error' };
  }
}

async function pullFromCloud(url){
  if(!url) return { ok:false, error:'no-url' };
  try{
    const res = await fetch(url, { method:'GET' });
    if(!res.ok) return { ok:false, error:'http-' + res.status };
    const data = await res.json();
    return { ok:true, data };
  }catch(err){
    return { ok:false, error: (err && err.message) || 'network-error' };
  }
}

// ===== إدارة الاتصال بمجلد Drive عبر Hash الرابط (v15 — بلا أي تخزين محلي) =====
// يُحفَظ رابط الاتصال بخادم Apps Script فقط (لا بيانات المدرسة) داخل Hash رابط الصفحة (#drive=...)
// — جزء من شريط العنوان/الإشارة المرجعية في المتصفح، وليس أي واجهة تخزين من واجهات المتصفح
// (localStorage/sessionStorage/IndexedDB). حفظ هذا الرابط بإشارة مرجعية (Bookmark) يكفي لإعادة فتح
// النظام متصلاً بنفس مجلد Drive مباشرة دون أي خطوة إضافية.
function getDriveUrlFromHash(){
  const h = window.location.hash || '';
  const m = h.match(/drive=([^&]+)/);
  if(!m) return '';
  try{ return decodeURIComponent(m[1]); }catch(err){ return ''; }
}
function setDriveUrlInHash(url){
  const newHash = '#drive=' + encodeURIComponent(url);
  if(window.history && window.history.replaceState){
    window.history.replaceState(null, '', window.location.pathname + window.location.search + newHash);
  } else {
    window.location.hash = newHash;
  }
}
function clearDriveUrlFromHash(){
  if(window.history && window.history.replaceState){
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  } else {
    window.location.hash = '';
  }
}

// أرشفة اختيارية لنسخة أرشيفية (CSV) من أي تقرير تراكمي عند تصديره أو طباعته فعلياً — طلب مستقل
// بعلامة type:'report' يميّزها خادم Apps Script عن طلب حفظ البيانات الأساسية الكامل (teachers/
// assignments/settings)، فيحفظها كملف داخل مجلد فرعي «التقارير/<الفئة>» في نفس مجلد Drive، بلا أي
// تأثير على البيانات الأساسية المحفوظة. فشل الأرشفة (لا رابط، لا إنترنت) صامت تماماً ولا يُعطّل
// تصدير/طباعة التقرير نفسه بأي حال — بنفس فلسفة عدم التعطيل المتبعة في المزامنة الأساسية.
function buildReportArchiveFilename(prefix){
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') +
    '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
  return prefix + '-' + stamp + '.csv';
}
async function pushReportToCloud(url, category, filename, csv){
  if(!url) return { ok:false, error:'no-url' };
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'report', category, filename, csv })
    });
    if(!res.ok) return { ok:false, error:'http-' + res.status };
    return { ok:true };
  }catch(err){
    return { ok:false, error: (err && err.message) || 'network-error' };
  }
}
function archiveReportToCloud(cloudSyncUrl, category, prefix, csv){
  if(!cloudSyncUrl) return;
  pushReportToCloud(cloudSyncUrl, category, buildReportArchiveFilename(prefix), csv);
}

function cloudSyncStatusText(status, lastSync){

    case 'success': return time ? ('تم الحفظ على Drive بنجاح — ' + time) : 'متصل بمجلد Drive';
    case 'error': return 'تعذّر الحفظ على Drive! يُعاد المحاولة تلقائياً — لا تُغلق هذه الصفحة حتى يتأكد الحفظ.';

}
function cloudSyncStatusColor(status){

}

function toIsoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayIso(){ return toIsoDate(new Date()); }
function startOfWeekIso(){ const d = new Date(); d.setDate(d.getDate() - d.getDay()); return toIsoDate(d); }
function startOfMonthIso(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01'; }
function toIsoDateUTC(d){ return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0'); }
// أسبوع ISO-8601 (يبدأ الاثنين) يُستخدم فقط لتفسير قيمة <input type="week">؛ يُحوَّل إلى نطاق أحد-خميس
// (أيام الدراسة الفعلية) بإزاحة يوم للخلف عن الاثنين للبداية و+3 أيام للنهاية.
function weekRangeFromIsoWeek(weekStr){
  const m = /^(\d{4})-W(\d{2})$/.exec(weekStr || '');
  if(!m) return null;
  const year = Number(m[1]), week = Number(m[2]);
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1 + (week - 1) * 7);
  const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() - 1);
  const thursday = new Date(monday); thursday.setUTCDate(monday.getUTCDate() + 3);
  return { from: toIsoDateUTC(sunday), to: toIsoDateUTC(thursday) };
}
function monthRangeFromValue(monthStr){
  const m = /^(\d{4})-(\d{2})$/.exec(monthStr || '');
  if(!m) return null;
  const year = Number(m[1]), month = Number(m[2]);
  const from = m[1] + '-' + m[2] + '-01';
  const lastDay = new Date(year, month, 0).getDate();
  const to = m[1] + '-' + m[2] + '-' + String(lastDay).padStart(2,'0');
  return { from, to };
}
function arabicDayFromDate(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return WEEKDAY_MAP[d.getDay()] ?? null;
}
function formatArabicDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  const day = d.getDate();
  const month = ARABIC_MONTHS[d.getMonth()];
  const year = d.getFullYear();
  const wd = arabicDayFromDate(iso) || (d.getDay()===5 ? 'الجمعة' : (d.getDay()===6 ? 'السبت' : ''));
  return wd + '، ' + day + ' ' + month + ' ' + year;
}

function toWhatsAppDigits(phone){
  if(!phone) return '';
  let digits = String(phone).replace(/\D/g,'');
  if(digits.startsWith('00966')) digits = digits.slice(2);
  if(digits.startsWith('966')) return digits;
  if(digits.startsWith('0')) return '966' + digits.slice(1);
  if(digits.length === 9) return '966' + digits;
  return digits;
}

// ===== محرك النسخ الاحتياطي ونقل البيانات (Backup & Restore Engine) =====
// نسخة بنية ملف النسخة الاحتياطية — لأغراض التوثيق فقط، ولا تُستخدم لرفض نسخ أقدم؛ كل الحقول
// القديمة تبقى مقروءة ومتوافقة تماماً (تُمزَج مع القيم الافتراضية عند الاسترجاع).
const BACKUP_FORMAT_VERSION = 3;

// الحمل الكامل للنسخة الاحتياطية: كل كائنات النظام دفعة واحدة — إعدادات المدرسة (بما فيها الشعاران
// بصيغة Base64 المخزَّنان أصلاً داخل schoolSettings)، قائمة المعلمين/المعلمات كاملة (الأنصبة، أرقام
// الجوال، الاستبعاد الإداري وسببه)، الجداول الأسبوعية الكاملة لكل معلم (بما فيها أي تعديل يدوي أو
// حصة أُضيفت عبر محرر الجدول التفاعلي — جزء أصلي من كائن الجدول نفسه)، وسجل التكليفات التاريخي
// الكامل لحصص الانتظار (الذي يحمل ضمنياً كل وقائع الغياب السابقة وعدادات الانتظار التراكمية لكل
// معلم، إذ لا يوجد سجل غياب منفصل في النظام — كل واقعة غياب تُمثَّل بتكليف أو أكثر في هذا السجل).
function buildFullBackup(teachers, assignments, schoolSettings){
  return {
    app: 'nuwwab',
    backupVersion: BACKUP_FORMAT_VERSION,
    exportedAt: new Date().toISOString(),
    teachers,
    assignments,
    schoolSettings
  };
}

function sanitizeFileNamePart(s){
  return String(s || '').trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-').slice(0, 60);
}

function buildBackupFileName(schoolSettings){

  return namePart ? ('Nuwwab_Backup_' + namePart + '_' + datePart + '.json') : ('Nuwwab_Backup_' + datePart + '.json');
}

// محاولة تنزيل فعلي للملف عبر Blob ورابط <a download> مخفي — يعمل بصورة طبيعية عند تشغيل الملف
// محلياً على جهاز المستخدم أو من أي استضافة عادية. داخل معاينة صفحة Artifact المنشورة تحديداً قد
// يُحجب التنزيل الفعلي من قِبل بيئة العرض المقيَّدة دون أي خطأ ظاهر؛ لهذا يُستكمل زر التصدير دائماً
// بنسخ النص كاملاً إلى الحافظة كبديل مضمون يعمل في الحالتين معاً (انظر استدعاءه في handleFullExport).
function tryDownloadJsonFile(text, fileName){
  try{
    const blob = new Blob([text], { type:'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 1000);
    return true;
  }catch(err){
    return false;
  }
}

// تنزيل النسخة الاحتياطية فعلياً على الجهازين معاً (محلياً وعلى الرابط السحابي المنشور):
// 1) عند التشغيل داخل صفحة Artifact المنشورة يوفّر الجسر الرسمي window.claude.use('downloads')
//    حفظاً فعلياً للملف مع مربع تأكيد يعرضه المتصفح للمستخدم — هذا هو المسار الموثوق على الرابط
//    السحابي، حيث لا يعمل رابط <a download> العادي داخل بيئة معاينة Artifact المقيَّدة.
// 2) عند التشغيل محلياً (فتح الملف مباشرة من الجهاز أو من أي استضافة عادية) لا يوجد window.claude
//    أصلاً، فيُستخدَم تنزيل Blob + <a download> التقليدي (tryDownloadJsonFile) الذي يعمل بصورة طبيعية
//    تماماً في هذه الحالة. أي رفض أو تعذّر في المسارين معاً يُعاد كنتيجة واضحة دون رمي أي استثناء،
//    ليُستكمل دوماً بنسخ النص إلى الحافظة كبديل مضمون (انظر handleFullExport في DataTab).
async function performBackupDownload(text, fileName){
  try{
    if(typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function'){
      const downloads = await window.claude.use('downloads').catch(() => null);
      if(downloads && typeof downloads.save === 'function'){
        try{
          const result = await downloads.save({ filename: fileName, data: new Blob([text], { type:'application/json' }) });
          return { mode:'capability', status: result.status };
        }catch(err){
          const code = (err && err.code) || 'unavailable';
          if(code === 'declined') return { mode:'capability', status:'declined' };
          // أي رفض آخر (rate_limited، too_large، capability غير متاحة...) — نتابع بالمسار الاحتياطي أدناه.
        }
      }
    }
  }catch(err){ /* تجاهل تماماً وتابع بالمسار الاحتياطي دون تعطيل التصدير */ }
  const attempted = tryDownloadJsonFile(text, fileName);
  return { mode:'blob', attempted };
}

// تحقق من صحة بنية ملف الاسترجاع وتوافقه قبل أي كتابة فعلية على حالة النظام — يمنع إفراغ بيانات
// المستخدم الحالية بملف تالف أو من تطبيق مختلف تماماً، ويُظهر سبباً واضحاً بدل فشل صامت.
function validateBackupShape(parsed){
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){
    throw new Error('الملف لا يحتوي على بيانات JSON صالحة لنظام نُواب.');
  }
  if(!Array.isArray(parsed.teachers)){
    throw new Error('بنية الملف غير متوافقة: لا يحتوي على قائمة معلمين (teachers).');
  }
  parsed.teachers.forEach((t, i) => {
    if(!t || typeof t !== 'object' || typeof t.name !== 'string'){
      throw new Error('بيانات المعلم رقم ' + (i + 1) + ' في الملف غير صالحة.');
    }
  });
  if(parsed.assignments !== undefined && !Array.isArray(parsed.assignments)){
    throw new Error('بنية الملف غير متوافقة: سجل التكليفات (assignments) ليس قائمة.');
  }
  return true;
}

// إعادة بناء سجل المعلم بأمان من بيانات مسترجَعة قد تكون ناقصة أو من نسخة أقدم — تُكمَّل كل الحقول
// الناقصة بقيم افتراضية سليمة بدل الثقة ببنية الملف حرفياً، لتفادي أي تعطّل في الواجهة بعد الاسترجاع.
function normalizeRestoredTeacher(raw){
  const schedule = emptySchedule();
  const rawSchedule = (raw && typeof raw.schedule === 'object' && raw.schedule) || {};
  DAYS.forEach(d => {
    PERIODS.forEach(p => {
      const cell = rawSchedule[d] && rawSchedule[d][p];
      schedule[d][p] = (cell && typeof cell === 'object') ? { busy: !!cell.busy, subject: cell.subject || '' } : { busy:false, subject:'' };
    });
  });
  return {
    id: raw.id || uid('t'),
    name: String(raw.name || '').trim() || 'بدون اسم',
    subject: raw.subject || '—',
    nisab: Number(raw.nisab) || 0,
    phone: raw.phone || '',
    substituteCount: Number(raw.substituteCount) || 0,
    excluded: !!raw.excluded,
    exclusionReason: raw.exclusionReason || '',
    schedule
  };
}

// نص شارة «تاريخ ووقت آخر حفظ سحابي ناجح» في بطاقة النسخ الاحتياطي — v15: لا يوجد حفظ محلي بعد
// الآن، فالشارة تعكس آخر لحظة نجح فيها دفع البيانات فعلياً إلى مجلد Drive المتصل.
function formatSavedAtBadge(iso){
  if(!iso) return 'لم يُحفظ على Drive بعد';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return 'لم يُحفظ على Drive بعد';
  return 'آخر حفظ سحابي ناجح: ' + formatArabicDate(toIsoDate(d)) + ' — ' + d.toLocaleTimeString('ar-SA');
}

function generateMockTeachers(count = 18){
  const teachers = [];
  const demoExclusions = { 2:'رائد نشاط', 9:'موجه طلابي' }; // أمثلة توضيحية للاستبعاد الإداري في البيانات التجريبية
  for(let i=0;i<count;i++){
    const subject = SUBJECTS[i % SUBJECTS.length];
    const nisabPool = [24,24,24,22,20,23,18,24,21];
    const nisab = nisabPool[i % nisabPool.length];
    const schedule = emptySchedule();
    let busyBudget = nisab;
    DAYS.forEach(day => {
      PERIODS.forEach(p => {
        const willBeBusy = busyBudget > 0 && Math.random() < 0.72;
        if(willBeBusy){
          schedule[day][p] = { busy:true, subject: subject + ' - ' + ['أ','ب','ج','د'][Math.floor(Math.random()*4)] };
          busyBudget--;
        }
      });
    });
    teachers.push({
      id: uid('t'),
      name: 'المعلم رقم ' + String(i+1).padStart(2,'0'),
      subject,
      nisab,
      phone: '05' + String(Math.floor(10000000 + Math.random()*89999999)),
      substituteCount: Math.floor(Math.random()*10),
      excluded: Object.prototype.hasOwnProperty.call(demoExclusions, i),
      exclusionReason: demoExclusions[i] || '',
      schedule
    });
  }
  return teachers;
}

function computeStats(teachers){
  const total = teachers.length;
  const fullCount = teachers.filter(t => isFullQuota(t.nisab)).length;
  const excludedCount = teachers.filter(t => t.excluded).length;
  const avgLoad = total ? (teachers.reduce((s,t)=>s+t.nisab,0)/total) : 0;
  const totalSub = teachers.reduce((s,t)=>s+t.substituteCount,0);
  return { total, fullCount, excludedCount, avgLoad, totalSub };
}

function computeDayAvailability(teachers, includeFullQuota){
  return DAYS.map(day => {
    let count = 0;
    teachers.forEach(t => {
      if(!t.excluded && (includeFullQuota || !isFullQuota(t.nisab))){
        PERIODS.forEach(p => { if(!t.schedule[day][p].busy) count++; });
      }
    });
    return { day, count };
  });
}

function countBusyInDay(teacher, day){
  return PERIODS.reduce((sum, p) => sum + (teacher.schedule[day][p].busy ? 1 : 0), 0);
}

function getNextDay(day){
  const idx = DAYS.indexOf(day);
  if(idx === -1 || idx === DAYS.length - 1) return null;
  return DAYS[idx + 1];
}

// محرك المفاضلة: ترتيب تصاعدي عبر ثلاثة معايير متتالية — (1) النصاب الأساسي الأسبوعي الأقل
// أولاً، (2) الأقل حصصاً في جدول نفس اليوم ثم في اليوم الذي يليه مباشرة (تفادياً لإرهاق معلم في
// يوم كثيف الحصص)، (3) الأقل تنفيذاً لحصص الانتظار تراكمياً لضمان التوازن. استبعاد المعلم الغائب
// واستبعاد أصحاب النصاب الكامل شرطان منفصلان يُطبَّقان في الفلترة (هنا وفي VacantSlotCard) قبل هذا الترتيب.
function eligibleForSlot(teachers, day, period, includeFullQuota){
  if(!day) return [];
  const nextDay = getNextDay(day);
  return teachers
    .filter(t => !t.excluded && !t.schedule[day][period].busy && (includeFullQuota || !isFullQuota(t.nisab)))
    .slice()
    .sort((a,b) => {
      if(a.nisab !== b.nisab) return a.nisab - b.nisab;
      const aSame = countBusyInDay(a, day), bSame = countBusyInDay(b, day);
      if(aSame !== bSame) return aSame - bSame;
      if(nextDay){
        const aNext = countBusyInDay(a, nextDay), bNext = countBusyInDay(b, nextDay);
        if(aNext !== bNext) return aNext - bNext;
      }
      if(a.substituteCount !== b.substituteCount) return a.substituteCount - b.substituteCount;
      return a.name.localeCompare(b.name, 'ar');
    });
}

function parseImportedRows(rows){
  if(!rows || !rows.length) throw new Error('الملف لا يحتوي على بيانات.');
  const teachers = rows.map((row, idx) => {
    const name = String(row['الاسم'] ?? row['الأسم'] ?? '').trim() || ('معلم ' + (idx+1));
    const subject = String(row['التخصص'] ?? '').trim() || '—';
    const nisabRaw = row['النصاب'];
    const nisab = Number(nisabRaw) || 0;
    const phone = String(row['رقم_الجوال'] ?? row['الجوال'] ?? row['رقم الجوال'] ?? '').trim();
    const substituteRaw = row['حصص_الانتظار'] ?? row['رصيد_الانتظار'] ?? row['حصص الانتظار'] ?? 0;
    const substituteCount = Number(substituteRaw) || 0;
    const schedule = emptySchedule();
    DAYS.forEach(day => {
      PERIODS.forEach(p => {
        const key = day + '-' + p;
        const cell = row[key];
        const val = (cell === undefined || cell === null) ? '' : String(cell).trim();
        if(val !== ''){
          schedule[day][p] = { busy:true, subject: val };
        }
      });
    });
    return { id: uid('t'), name, subject, nisab, phone, substituteCount, excluded:false, exclusionReason:'', schedule };
  });
  return teachers;
}

function parsePhoneUpdates(rows){
  if(!rows) return [];
  return rows.map(r => ({
    name: String(r['الاسم'] ?? r['الأسم'] ?? '').trim(),
    phone: String(r['رقم_الجوال'] ?? r['الجوال'] ?? r['رقم الجوال'] ?? '').trim()
  })).filter(r => r.name);
}

// نموذج رفع أرقام الجوال بالترتيب — مسار مستقل تماماً عن المطابقة بالاسم أعلاه: صف واحد لكل معلم
// بنفس ترتيب القائمة الحالية في البرنامج تماماً، وعمود «م» هو مرجع المطابقة الفعلي (لا الاسم،
// المعروض فقط للمراجعة البصرية). خلية "رقم_الجوال" الفارغة تعني «اتركه كما هو»، وليست مسحاً.
function buildPhoneOrderTemplateCsv(teachers){
  const header = ['م','الاسم','رقم_الجوال'];
  const lines = [header.map(toCsvValue).join(',')];
  teachers.forEach((t,i) => { lines.push([i+1, t.name, t.phone || ''].map(toCsvValue).join(',')); });
  return '﻿' + lines.join('\r\n');
}

function parsePhoneOrderUpdates(rows, teacherCount){
  const updates = [];
  const invalid = [];
  (rows || []).forEach((r, fileIdx) => {
    const phone = String(r['رقم_الجوال'] ?? r['الجوال'] ?? r['رقم الجوال'] ?? '').trim();
    if(!phone) return;
    const rawOrder = r['م'];
    const orderProvided = rawOrder !== undefined && rawOrder !== null && String(rawOrder).trim() !== '';
    let index;
    if(!orderProvided){
      index = fileIdx; // لا عمود "م" في الملف أصلاً — رجوع كامل لترتيب صفوف الملف نفسه
    } else {
      const order = Number(rawOrder);
      // عمود "م" موجود بقيمة غير صالحة (خارج النطاق، صفر، كسرية...) — يُرفض الصف صريحاً ولا
      // يُخمَّن موضعه من ترتيب الملف، لتفادي إسناد رقم الجوال لمعلم خاطئ بصمت عند أي خلل بالملف.
      if(!Number.isInteger(order) || order < 1 || order > teacherCount){ invalid.push(fileIdx + 1); return; }
      index = order - 1;
    }
    updates.push({ index, phone });
  });
  return { updates, invalid };
}

function buildTemplateHeaders(){
  const headers = ['الاسم','التخصص','النصاب','رقم_الجوال','حصص_الانتظار'];
  DAYS.forEach(day => PERIODS.forEach(p => headers.push(day + '-' + p)));
  return headers;
}

function toCsvValue(v){
  const s = String(v ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function buildReportCsv(rows){
  const header = ['م','المعلم','التخصص','النصاب','حصص الانتظار خلال الفترة','نسبة من إجمالي الفترة (%)'];
  const lines = [header.map(toCsvValue).join(',')];
  rows.forEach((r,i) => {
    lines.push([i+1, r.teacher.name, r.teacher.subject, r.teacher.nisab, r.count, r.percent.toFixed(1)].map(toCsvValue).join(','));
  });
  return '﻿' + lines.join('\r\n');
}

// ===== المسار الأول: قراءة ملفات aSc Timetables بصيغة Excel Spreadsheet 2003 XML =====

function getWorksheetName(wsEl){
  if(!wsEl || !wsEl.attributes) return '';
  for(const attr of wsEl.attributes){
    if(attr.localName === 'Name') return attr.value;
  }
  return '';
}

function reconstructRowsFromWorksheet(wsEl){
  const tableEl = Array.from(wsEl.childNodes).find(n => n.localName === 'Table');
  if(!tableEl) return [];
  const rowEls = Array.from(tableEl.childNodes).filter(n => n.localName === 'Row');
  const rows = [];
  let rowCounter = 1;
  rowEls.forEach(rowEl => {
    let rIdxAttr = null;
    if(rowEl.attributes){
      for(const attr of rowEl.attributes){ if(attr.localName === 'Index') rIdxAttr = attr.value; }
    }
    if(rIdxAttr) rowCounter = Number(rIdxAttr);
    const cells = {};
    let colCounter = 1;
    const cellEls = Array.from(rowEl.childNodes).filter(n => n.localName === 'Cell');
    cellEls.forEach(cellEl => {
      let cIdxAttr = null, mergeAcross = 0;
      if(cellEl.attributes){
        for(const attr of cellEl.attributes){
          if(attr.localName === 'Index') cIdxAttr = attr.value;
          if(attr.localName === 'MergeAcross') mergeAcross = Number(attr.value) || 0;
        }
      }
      if(cIdxAttr) colCounter = Number(cIdxAttr);
      const dataEl = Array.from(cellEl.childNodes).find(n => n.localName === 'Data');
      const text = dataEl ? (dataEl.textContent || '') : '';
      cells[colCounter] = text;
      colCounter += 1 + mergeAcross;
    });
    rows.push({ index: rowCounter, cells });
    rowCounter += 1;
  });
  return rows;
}

function isBareIntegerCell(text, maxLen = 3){
  const t = String(text || '').trim();
  return /^\d+$/.test(t) && t.length <= maxLen;
}

// إشارة بنيوية موثوقة لصف "رأس معلم" داخل ورقة "1 اسناد_المعلم": صف يحوي خليتين
// مأهولتين فقط — الاسم في الأولى، ونصابه الكلي (رقم صحيح) في السابعة — بصرف النظر
// عن عدد كلمات الاسم. التحقق ضد بيانات حقيقية أثبت أن الاعتماد على عدّ كلمات الاسم
// (٣ كلمات فأكثر) يفشل مع أسماء من كلمة أو كلمتين فقط ويسبب دمج معلمين في سجل واحد.
function extractAscTeacherProfiles(rows){
  const teachers = [];
  let current = null;
  rows.forEach(row => {
    const entries = Object.entries(row.cells)
      .map(([k,v]) => [Number(k), String(v == null ? '' : v).trim()])
      .filter(([,v]) => v !== '')
      .sort((a,b) => a[0]-b[0]);
    if(entries.length === 0) return;
    if(entries.length === 2 && !isBareIntegerCell(entries[0][1]) && isBareIntegerCell(entries[1][1])){
      current = { tempId: uid('asc'), name: entries[0][1], nisab: Number(entries[1][1]), details: [] };
      teachers.push(current);
      return;
    }
    if(current && isBareIntegerCell(entries[0][1])){
      const map = Object.fromEntries(entries);
      const baseCol = entries[0][0];
      current.details.push({
        className: (map[baseCol+1] || '').trim(),
        subject: (map[baseCol+2] || '').trim(),
        periods: Number(map[baseCol+6]) || 0
      });
    }
  });
  return teachers;
}

function summarizeAscSubjects(details){
  const bySubject = new Map();
  (details || []).forEach(d => {
    const key = (d.subject || '').trim();
    if(!key) return;
    bySubject.set(key, (bySubject.get(key) || 0) + (Number(d.periods) || 0));
  });
  return Array.from(bySubject.entries()).sort((a,b) => b[1]-a[1]);
}

function parseAscTeacherXml(xmlText){
  if(typeof DOMParser === 'undefined') throw new Error('المتصفح لا يدعم تحليل ملفات XML.');
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length){
    throw new Error('ملف XML غير صالح أو تالف. تأكد من أنه تصدير سليم من aSc Timetables.');
  }
  const worksheets = Array.from(doc.getElementsByTagNameNS('*', 'Worksheet'));
  if(worksheets.length === 0) throw new Error('لم يتم العثور على أي ورقة عمل داخل الملف.');
  const targetName = '1 اسناد_المعلم';
  const target = worksheets.find(ws => getWorksheetName(ws).trim() === targetName);
  if(!target){
    const names = worksheets.map(getWorksheetName).filter(Boolean).join('، ');
    throw new Error('لم يتم العثور على ورقة "' + targetName + '" داخل الملف. الأوراق الموجودة: ' + (names || 'لا توجد'));
  }
  const rows = reconstructRowsFromWorksheet(target);
  const profiles = extractAscTeacherProfiles(rows);
  if(profiles.length === 0) throw new Error('تعذر استخراج أي معلم من الورقة رغم العثور عليها — تأكد من تطابق تنسيق الملف مع مخرجات aSc القياسية.');
  return { sheetName: getWorksheetName(target), profiles };
}

// ===== المسار الثاني: قراءة الجدول المدرسي العام (فراغ/إشغال) من ملف Excel =====

function foldArabicForMatch(s){
  return String(s || '').trim()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/\s+/g, '');
}

const DAY_FOLD_MAP = (() => {
  const m = {};
  DAYS.forEach(d => { m[foldArabicForMatch(d)] = d; });
  return m;
})();

function matchDayName(raw){
  return DAY_FOLD_MAP[foldArabicForMatch(raw)] || null;
}

// نصوص خلايا مثل "1/4" أو "2/1" شائعة جداً كرموز فصول/شعب في جداول aSc، وإكسل يحوّلها أحياناً
// تلقائياً إلى تاريخ أو رقم تسلسلي حسب تنسيق الخلية إن لم تُحفظ صراحة كنص. الاعتماد على cell.v وحده
// في هذه الحالة قد يُنتج قيمة تالفة (كائن تاريخ أو رقماً تسلسلياً) بدل النص الأصلي المقروء. الحل
// الموثوق: تفضيل cell.w دائماً — وهو النص المهيّأ للعرض تماماً كما يظهر في إكسل — والرجوع إلى cell.v
// فقط إن لم يوجد.
function cellDisplayText(cell){
  if(!cell) return '';
  if(cell.w !== undefined && cell.w !== null && cell.w !== '') return String(cell.w).trim();
  if(cell.v === undefined || cell.v === null) return '';
  return String(cell.v).trim();
}

// تطبيع اسم المعلم لأغراض المطابقة فقط (وليس للعرض): إسقاط المسافات غير القاطعة، ضغط المسافات
// المتعددة إلى مسافة واحدة، وإزالة الألقاب الشائعة (أ/ ، أ. ، الأستاذ ، الأستاذة) التي قد تظهر في
// أحد الملفين (XML أو الجدول العام) دون الآخر — لضمان مطابقة موثوقة بين المسارين حتى مع اختلافات
// تنسيقية بسيطة بين تصديرين منفصلين لنفس المعلم.
function normalizeTeacherName(raw){
  return String(raw || '')
    .replace(/ /g, ' ')
    .trim()
    .replace(/^(الأستاذة|الأستاذ|أ\/|أ\.)\s*/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function findGeneralTimetableSheet(workbook){
  const preferredName = 'الجدول العام للمعلمين';
  if(workbook.Sheets[preferredName]){
    return { name: preferredName, sheet: workbook.Sheets[preferredName] };
  }
  const firstName = workbook.SheetNames[0];
  return { name: firstName, sheet: workbook.Sheets[firstName] };
}

function buildDayColumnRanges(sheet){
  const merges = sheet['!merges'] || [];
  const candidates = [];
  merges.forEach(m => {
    const addr = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
    const cell = sheet[addr];
    const day = matchDayName(cellDisplayText(cell));
    if(day) candidates.push({ row: m.s.r, day, colStart: m.s.c, colEnd: m.e.c });
  });
  if(candidates.length === 0) return null;
  const byRow = new Map();
  candidates.forEach(c => {
    if(!byRow.has(c.row)) byRow.set(c.row, []);
    byRow.get(c.row).push(c);
  });
  let bestRow = null, bestList = [];
  byRow.forEach((list, row) => { if(list.length > bestList.length){ bestRow = row; bestList = list; } });
  return { headerRow: bestRow, days: bestList };
}

function buildPeriodColumnMap(sheet, dayRanges, periodRowIndex){
  const map = [];
  dayRanges.forEach(({ day, colStart, colEnd }) => {
    for(let c = colStart; c <= colEnd; c++){
      const addr = XLSX.utils.encode_cell({ r: periodRowIndex, c });
      const cell = sheet[addr];
      const raw = cellDisplayText(cell);
      const period = Number(toWesternDigits(raw));
      if(period >= 1 && period <= 7){
        map.push({ day, period, col: c });
      } else {
        const fallback = c - colStart + 1;
        if(fallback >= 1 && fallback <= 7) map.push({ day, period: fallback, col: c });
      }
    }
  });
  return map;
}

function findTeacherNameColumn(sheet, periodRowIndex, dayRanges, range){
  const usedCols = new Set();
  dayRanges.forEach(d => { for(let c = d.colStart; c <= d.colEnd; c++) usedCols.add(c); });
  for(let c = range.s.c; c <= range.e.c; c++){
    if(usedCols.has(c)) continue;
    const addr = XLSX.utils.encode_cell({ r: periodRowIndex, c });
    const cell = sheet[addr];
    const text = cellDisplayText(cell);
    if(text.includes('معلم')) return c;
  }
  for(let c = range.s.c; c <= range.e.c; c++){ if(!usedCols.has(c)) return c; }
  return range.s.c;
}

function parseGeneralTimetableWorkbook(workbook){
  const { name: sheetName, sheet } = findGeneralTimetableSheet(workbook);
  if(!sheet || !sheet['!ref']) throw new Error('لم يتم العثور على بيانات داخل الملف.');
  const dayInfo = buildDayColumnRanges(sheet);
  if(!dayInfo) throw new Error('تعذر العثور على صف أسماء الأيام (الأحد، الاثنين، ...) داخل الملف. تأكد من أن الملف مُصدَّر من aSc Timetables بنفس التنسيق.');
  const periodRowIndex = dayInfo.headerRow + 1;
  const range = XLSX.utils.decode_range(sheet['!ref']);
  const periodMap = buildPeriodColumnMap(sheet, dayInfo.days, periodRowIndex);
  if(periodMap.length === 0) throw new Error('تعذر العثور على أرقام الحصص (١-٧) أسفل رؤوس الأيام.');
  const nameCol = findTeacherNameColumn(sheet, periodRowIndex, dayInfo.days, range);
  const results = [];
  for(let r = periodRowIndex + 1; r <= range.e.r; r++){
    const nameAddr = XLSX.utils.encode_cell({ r, c: nameCol });
    const nameCell = sheet[nameAddr];
    const name = cellDisplayText(nameCell);
    if(!name) continue;
    const schedule = emptySchedule();
    let busyCount = 0;
    periodMap.forEach(({ day, period, col }) => {
      const addr = XLSX.utils.encode_cell({ r, c: col });
      const cell = sheet[addr];
      const text = cellDisplayText(cell);
      if(text !== ''){
        schedule[day][period] = { busy: true, subject: text };
        busyCount++;
      }
    });
    results.push({ name, schedule, busyCount });
  }
  return { sheetName, rows: results };
}

// ===== استيراد عام من ملفات Word (.docx) =====
// يُحوَّل كل جدول Word حقيقي (<w:tbl>) إلى بنية "ورقة" تحاكي تماماً واجهة SheetJS (خلايا بعناوين A1/B1...،
// !ref، !merges) ليُمرَّر مباشرة إلى parseGeneralTimetableWorkbook نفسها المستخدمة أصلاً لملفات Excel
// (فيُفحص كجدول عام للفراغ/الإشغال)، أو تُحوَّل صفوفه إلى كائنات ليُستخدم مع parseImportedRows نفسها
// (فيُفحص كقائمة معلمين بالقالب القياسي) — دون أي منطق تحليل أو تحقق جديد ومنفصل عن المسارين الموجودين
// أصلاً، تفادياً لازدواج القواعد وضماناً لتطابق النتيجة تماماً مع استيراد الملف نفسه بصيغة Excel.

let jsZipLoadPromise = null;
function loadJsZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(jsZipLoadPromise) return jsZipLoadPromise;
  jsZipLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js';
    script.onload = () => {
      if(window.JSZip){
        resolve(window.JSZip);
      } else {
        jsZipLoadPromise = null;
        reject(new Error('تعذر تحميل مكتبة قراءة ملفات Word.'));
      }
    };
    script.onerror = () => { jsZipLoadPromise = null; reject(new Error('تعذر تحميل مكتبة قراءة ملفات Word من الشبكة.')); };
    document.head.appendChild(script);
  });
  return jsZipLoadPromise;
}

function docxCellText(tcEl){
  const texts = Array.from(tcEl.getElementsByTagNameNS('*', 't')).map(t => t.textContent || '');
  return texts.join('').replace(/\s+/g, ' ').trim();
}

function docxAttrByLocalName(el, name){
  if(!el || !el.attributes) return null;
  for(const attr of el.attributes){ if(attr.localName === name) return attr.value; }
  return null;
}

function docxFirstChildByLocalName(el, name){
  if(!el) return null;
  return Array.from(el.childNodes).find(n => n.localName === name) || null;
}

// يبني شبكة صفوف/أعمدة من عنصر <w:tbl> واحد، مع قراءة gridSpan (الدمج الأفقي) فقط — وهو الدمج الوحيد
// ذو الأثر الفعلي على اكتشاف رؤوس الأيام (buildDayColumnRanges يقرأ !merges بنفس أسلوب ملفات aSc، حيث
// يُدمَج اسم اليوم أفقياً فوق أعمدة حصصه السبع).
function docxTableToGrid(tblEl){
  const rowEls = Array.from(tblEl.childNodes).filter(n => n.localName === 'tr');
  return rowEls.map(trEl => {
    const cellEls = Array.from(trEl.childNodes).filter(n => n.localName === 'tc');
    return cellEls.map(tc => {
      const tcPr = docxFirstChildByLocalName(tc, 'tcPr');
      let gridSpan = 1;
      if(tcPr){
        const gridSpanEl = docxFirstChildByLocalName(tcPr, 'gridSpan');
        if(gridSpanEl){
          const val = Number(docxAttrByLocalName(gridSpanEl, 'val'));
          if(val >= 1) gridSpan = val;
        }
      }
      return { text: docxCellText(tc), gridSpan };
    });
  });
}

// يحوّل شبكة جدول Word إلى كائن "ورقة" بنفس بنية SheetJS تماماً — فتعمل عليها كل دوال تحليل الجدول
// العام الموجودة أصلاً (buildDayColumnRanges، buildPeriodColumnMap، findTeacherNameColumn، cellDisplayText)
// دون أي تعديل فيها.
function docxGridToSheet(gridRows){
  const sheet = {};
  const merges = [];
  let maxCol = 0;
  gridRows.forEach((rowCells, r) => {
    let c = 0;
    rowCells.forEach(cell => {
      const span = Math.max(1, cell.gridSpan || 1);
      const addr = XLSX.utils.encode_cell({ r, c });
      sheet[addr] = { v: cell.text, w: cell.text };
      if(span > 1) merges.push({ s:{ r, c }, e:{ r, c: c + span - 1 } });
      c += span;
    });
    if(c - 1 > maxCol) maxCol = c - 1;
  });
  sheet['!ref'] = XLSX.utils.encode_range({ s:{ r:0, c:0 }, e:{ r: Math.max(0, gridRows.length - 1), c: Math.max(0, maxCol) } });
  sheet['!merges'] = merges;
  return sheet;
}

// يحوّل شبكة جدول Word إلى مصفوفة كائنات (الصف الأول رؤوس أعمدة، كما تُنتجه XLSX.utils.sheet_to_json
// لملفات Excel) ليُستخدم مباشرة مع parseImportedRows نفسها — لا منطق تحليل جديد.
function docxGridRowsToObjects(gridRows){
  if(gridRows.length < 2) return [];
  const expand = (row) => {
    const out = [];
    row.forEach(cell => { const span = Math.max(1, cell.gridSpan || 1); for(let i=0;i<span;i++) out.push(cell.text); });
    return out;
  };
  const headers = expand(gridRows[0]);
  const rows = [];
  for(let r = 1; r < gridRows.length; r++){
    const values = expand(gridRows[r]);
    const obj = {};
    let hasValue = false;
    headers.forEach((h, i) => {
      if(!h) return;
      const v = values[i] !== undefined ? values[i] : '';
      obj[h] = v;
      if(v !== '') hasValue = true;
    });
    if(hasValue) rows.push(obj);
  }
  return rows;
}

// نقطة الدخول الرئيسية: تحاول أولاً تفسير كل جدول داخل الملف كجدول عام (فراغ/إشغال، بنفس منطق aSc)،
// ثم كقائمة معلمين بالقالب القياسي إن فشلت المحاولة الأولى على كل الجداول — دون افتراض بنية واحدة
// مسبقاً، لأن مستند Word قد يصدر بأي من الشكلين حسب من أنشأه.
async function parseWordDocument(arrayBuffer){
  const JSZipLib = await loadJsZip();
  let zip;
  try{
    zip = await JSZipLib.loadAsync(arrayBuffer);
  }catch(err){
    throw new Error('تعذر فتح الملف كأرشيف Word (.docx) صالح — تأكد من أنه ملف .docx حقيقي لا .doc القديم أو ملفاً تالفاً.');
  }
  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error('الملف ليس مستند Word (.docx) صالحاً — لم يُعثر على محتواه الداخلي المتوقع.');
  const xmlText = await docFile.async('string');
  if(typeof DOMParser === 'undefined') throw new Error('المتصفح لا يدعم تحليل ملفات Word.');
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length){
    throw new Error('تعذر تحليل محتوى ملف Word — قد يكون الملف تالفاً.');
  }
  const tableEls = Array.from(doc.getElementsByTagNameNS('*', 'tbl'));
  if(tableEls.length === 0){
    throw new Error('لم يُعثر على أي جدول حقيقي داخل ملف Word (أُدرج عبر Insert ← Table). النص الحر أو الصور لا تُدعَم — استخدم استيراد Excel/CSV أو PDF بدلاً من ذلك.');
  }

  for(const tblEl of tableEls){
    try{
      const grid = docxTableToGrid(tblEl);
      const sheet = docxGridToSheet(grid);
      const fakeWb = { SheetNames:['Sheet1'], Sheets:{ Sheet1: sheet } };
      const result = parseGeneralTimetableWorkbook(fakeWb);
      if(result.rows.length > 0) return { mode:'timetable', rows: result.rows };
    }catch(err){ /* جرّب الجدول التالي، أو المحاولة الثانية أدناه */ }
  }

  for(const tblEl of tableEls){
    try{
      const grid = docxTableToGrid(tblEl);
      const objRows = docxGridRowsToObjects(grid);
      if(objRows.length === 0) continue;
      const teachers = parseImportedRows(objRows);
      if(teachers.length > 0) return { mode:'roster', teachers };
    }catch(err){ /* جرّب الجدول التالي */ }
  }

  throw new Error(
    'عُثر على ' + tableEls.length + ' جدول داخل ملف Word، لكن تعذّر التعرّف على بنية أي منها: ' +
    'لا كجدول عام للفراغ/الإشغال (يلزمه صف بأسماء الأيام الخمسة مدموجة أفقياً فوق أعمدة حصصها السبع، بنفس تنسيق تصدير aSc)، ' +
    'ولا كقائمة معلمين بالقالب القياسي (يلزمه صف أول برؤوس أعمدة مطابقة، مثل الاسم والتخصص والنصاب). ' +
    'للحصول على أدق نتيجة يُفضَّل استيراد نفس البيانات بصيغة Excel/CSV.'
  );
}

let pdfjsLoadPromise = null;
